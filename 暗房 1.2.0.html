const RT = { photo: null, img: null, cropRatio: 'free', rotate: 0, flipH: false, flipV: false, filter: 'original', brightness: 0, contrast: 0, saturation: 0 };
function openRetouchEditor(p) {
  if (!p || p.kind === 'live') { toast('视频暂不支持修图'); return; }
  if (!p.blob) { toast('外链照片不支持修图，请先重新上传'); return; }
  RT.photo = p; RT.cropRatio = 'free'; RT.rotate = 0; RT.flipH = false; RT.flipV = false;
  RT.filter = 'original'; RT.brightness = 0; RT.contrast = 0; RT.saturation = 0;
  const src = photoSrc(p);
  const img = new Image();
  img.onload = () => {
    RT.img = img; RT.sx = 0; RT.sy = 0; RT.sw = img.naturalWidth; RT.sh = img.naturalHeight;
    $('#edCanvas').width = img.naturalWidth; $('#edCanvas').height = img.naturalHeight;
    $$('#edFilterRow .editor-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === 'original'));
    $$('#edCropRow .editor-btn').forEach(b => b.classList.toggle('active', b.dataset.crop === 'free'));
    $('#edBrightness').value = 0; $('#edContrast').value = 0; $('#edSaturation').value = 0;
    $('#edBrightnessVal').textContent = 0; $('#edContrastVal').textContent = 0; $('#edSaturationVal').textContent = 0;
    $('#edRestoreSection').style.display = p.originalBlob ? 'block' : 'none';
    renderEditorPreview();
    editorEl.classList.add('open'); document.body.style.overflow = 'hidden'; appRoot.setAttribute('inert', '');
  };
  img.onerror = () => toast('图片加载失败');
  img.src = src;
}
function renderEditorPreview() {
  const img = RT.img; if (!img) return;
  const canvas = $('#edCanvas'); const ctx = canvas.getContext('2d');
  const { sx, sy, sw, sh, rotate, flipH, flipV, filter, brightness, contrast, saturation } = RT;
  const rotated = (rotate === 90 || rotate === 270);
  canvas.width = rotated ? sh : sw; canvas.height = rotated ? sw : sh;
  let filterStr = '';
  if (filter === 'warm') filterStr = 'sepia(0.35) saturate(1.2) contrast(1.05) brightness(1.04) hue-rotate(-6deg)';
  else if (filter === 'bw') filterStr = 'grayscale(1) contrast(1.14) brightness(1.02)';
  else if (filter === 'fade') filterStr = 'saturate(0.62) contrast(0.88) brightness(1.08) sepia(0.14)';
  filterStr += ` brightness(${1 + brightness / 100}) contrast(${1 + contrast / 100}) saturate(${1 + saturation / 100})`;
  ctx.filter = filterStr;
  ctx.save(); ctx.translate(canvas.width / 2, canvas.height / 2);
  ctx.rotate(rotate * Math.PI / 180); ctx.scale(flipH ? -1 : 1, flipV ? -1 : 1);
  ctx.drawImage(img, sx, sy, sw, sh, -sw / 2, -sh / 2, sw, sh);
  ctx.restore();
}
function applyCropRatio(ratio) {
  RT.cropRatio = ratio;
  const img = RT.img; if (!img) return;
  const W = img.naturalWidth, H = img.naturalHeight;
  let w, h;
  if (ratio === 'free') { w = W; h = H; }
  else {
    const [rw, rh] = ratio.split(':').map(Number);
    const target = rw / rh; const cur = W / H;
    if (cur > target) { h = H; w = H * target; } else { w = W; h = W / target; }
  }
  RT.sx = (W - w) / 2; RT.sy = (H - h) / 2; RT.sw = w; RT.sh = h;
  renderEditorPreview();
}
function closeEditor() {
  editorEl.classList.remove('open');
  if (!lbEl.classList.contains('open')) { document.body.style.overflow = ''; appRoot.removeAttribute('inert'); }
  RT.photo = null; RT.img = null;
}

/* 25. 备份 */
async function exportBackup() {
  const exported = [];
  for (const p of state.photos) {
    const o = { ...p };
    if (p.blob) { o.blobData = await blobToDataURL(p.blob); delete o.blob; }
    if (p.originalBlob) { o.originalBlobData = await blobToDataURL(p.originalBlob); delete o.originalBlob; }
    if (p.videoBlob) { o.videoBlobData = await blobToDataURL(p.videoBlob); delete o.videoBlob; }
    if (p.coverBlob) { o.coverBlobData = await blobToDataURL(p.coverBlob); delete o.coverBlob; }
    exported.push(o);
  }
  const payload = { app: 'darkroom-gallery', version: 2, exportedAt: new Date().toISOString(), albums: state.albums, sceneTypes: state.sceneTypes, homeSort: state.settings.homeSort, trashRetentionDays: state.settings.trashRetentionDays, photos: exported };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `darkroom-backup-${localDateStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
  toast('备份已导出');
}
function blobToDataURL(blob) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(blob); }); }
function dataURLToBlob(dataUrl) {
  const [head, body] = dataUrl.split(',');
  const mime = (head.match(/:(.*?);/) || [, 'image/jpeg'])[1];
  const bin = atob(body); const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}
async function importBackup(file) {
  const text = await file.text();
  const data = JSON.parse(text);
  if (!data || !Array.isArray(data.photos)) throw new Error('bad format');
  let count = 0;
  for (const a of (data.albums || [])) await idbPut('albums', a);
  if (Array.isArray(data.sceneTypes) && data.sceneTypes.length >= 2) state.sceneTypes = data.sceneTypes;
  else state.sceneTypes = [...DEFAULT_SCENES];
  await idbPut('settings', { key: 'sceneTypes', value: state.sceneTypes });
  if (data.homeSort) { state.settings.homeSort = data.homeSort; await idbPut('settings', { key: 'homeSort', value: data.homeSort }); }
  if (data.trashRetentionDays) { state.settings.trashRetentionDays = data.trashRetentionDays; await idbPut('settings', { key: 'trashRetentionDays', value: data.trashRetentionDays }); }
  for (const p of data.photos) {
    const o = { ...p };
    if (o.blobData) { o.blob = dataURLToBlob(o.blobData); delete o.blobData; }
    if (o.originalBlobData) { o.originalBlob = dataURLToBlob(o.originalBlobData); delete o.originalBlobData; }
    if (o.videoBlobData) { o.videoBlob = dataURLToBlob(o.videoBlobData); delete o.videoBlobData; }
    if (o.coverBlobData) { o.coverBlob = dataURLToBlob(o.coverBlobData); delete o.coverBlobData; }
    if (o.deletedAt === undefined) o.deletedAt = null;
    if (o.restoredAt === undefined) o.restoredAt = null;
    if (o.scene === undefined) o.scene = null;
    if (o.featuredIn === undefined) o.featuredIn = [];
    if (o.extraAlbumIds === undefined) o.extraAlbumIds = [];
    if (o.kind !== 'photo' && o.kind !== 'polaroid' && o.kind !== 'live' && o.kind !== 'film') o.kind = 'photo';
    await idbPut('photos', o); count++;
  }
  state.photos = await idbAll('photos'); state.albums = await idbAll('albums');
  await idbPut('settings', { key: 'seeded', value: true });
  toast(`已导入 ${count} 张照片`);
  refreshCurrentView();
}

    document.addEventListener('dragstart', e => { if (isLongPress) e.preventDefault(); }, { capture: true });
    document.addEventListener('contextmenu', e => { if (isLongPress) e.preventDefault(); });
    document.addEventListener('click', e => { if (isLongPress || ignoreNextClick) { e.preventDefault(); e.stopPropagation(); } }, { capture: true });
  }
  const toolbars = [document.querySelector('.lb-tools'), document.querySelector('.lb-mobile-tools')];
  toolbars.forEach(toolbar => {
    if (!toolbar) return;
    toolbar.style.touchAction = 'none';
    toolbar.style.userSelect = 'none';
    toolbar.style.webkitUserSelect = 'none';
    toolbar.addEventListener('pointerdown', e => {
      if (e.button !== 0 && e.pointerType === 'mouse') return;
      const btn = e.target.closest('button');
      if (!btn || btn.disabled) return;
      isLongPress = false;
      startBtn = btn; activeBtn = btn; currentTargetBtn = btn;
      startX = e.clientX; startY = e.clientY;
      pressTimer = setTimeout(() => {
        isLongPress = true; document.body.style.userSelect = 'none';
        const rect = btn.getBoundingClientRect();
        haloEl.style.width = `44px`; haloEl.style.height = `44px`;
        haloEl.style.left = `${rect.left + rect.width / 2}px`; haloEl.style.top = `${rect.top + rect.height / 2}px`;
        haloEl.style.borderRadius = '50%'; haloEl.style.transform = `translate(-50%, -50%) scale(1)`;
        haloEl.classList.add('active'); haloEl.classList.remove('dragging');
        if (navigator.vibrate) navigator.vibrate(20);
      }, 300);
    });
    toolbar.addEventListener('pointermove', e => {
      if (!isLongPress) { if (Math.abs(e.clientX - startX) > 10 || Math.abs(e.clientY - startY) > 10) clearTimeout(pressTimer); return; }
      e.preventDefault();
      haloEl.classList.add('dragging');
      haloEl.style.left = `${e.clientX}px`; haloEl.style.top = `${e.clientY}px`;
      const dx = e.clientX - startX; const dy = e.clientY - startY;
      const distance = Math.sqrt(dx * dx + dy * dy);
      if (currentTargetBtn === startBtn && distance > 20) {
        const scaleX = 1 + Math.abs(dx) * 0.005; const scaleY = 1 + Math.abs(dy) * 0.005;
        haloEl.style.transform = `translate(-50%, -50%) scaleX(${scaleX}) scaleY(${scaleY})`;
        haloEl.style.borderRadius = '40%';
      }
      let targetBtn = null;
      const target = document.elementFromPoint(e.clientX, e.clientY);
      const elBtn = target?.closest('button');
      if (elBtn && toolbar.contains(elBtn) && !elBtn.disabled) targetBtn = elBtn;
      else {
        const buttons = Array.from(toolbar.querySelectorAll('button')).filter(b => !b.disabled && b.style.display !== 'none');
        if (buttons.length > 0) {
          let minDist = Infinity, nearest = null;
          buttons.forEach(b => {
            const rect = b.getBoundingClientRect();
            const cx = rect.left + rect.width / 2; const cy = rect.top + rect.height / 2;
            const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
            if (dist < minDist) { minDist = dist; nearest = b; }
          });
          if (minDist < 150) targetBtn = nearest;
        }
      }
      if (targetBtn) {
        if (currentTargetBtn !== targetBtn) {
          currentTargetBtn = targetBtn; activeBtn = targetBtn;
          haloEl.classList.remove('dragging');
          haloEl.style.width = `44px`; haloEl.style.height = `44px`;
          haloEl.style.borderRadius = '50%'; haloEl.style.transform = `translate(-50%, -50%) scale(1)`;
          const rect = targetBtn.getBoundingClientRect();
          haloEl.style.left = `${rect.left + rect.width / 2}px`; haloEl.style.top = `${rect.top + rect.height / 2}px`;
          if (navigator.vibrate) navigator.vibrate(15);
        }
      } else { currentTargetBtn = null; activeBtn = null; }
    });
    toolbar.addEventListener('pointerup', e => {
      clearTimeout(pressTimer);
      if (isLongPress) {
        e.preventDefault(); e.stopPropagation();
        isLongPress = false; document.body.style.userSelect = '';
        haloEl.classList.remove('active', 'dragging');
        if (activeBtn) setTimeout(() => { activeBtn.click(); }, 10);
      }
      activeBtn = null; currentTargetBtn = null;
    });
    toolbar.addEventListener('pointercancel', cancelLongPress);
  });
}

window.addEventListener('resize', () => {
  const motionBtns = $('#lbMotionBtns');
  if (!motionBtns) return;
  if (LB.motion && LB.exifOpen) {
    if (window.innerWidth > 860) { motionBtns.classList.add('shift-for-exif'); motionBtns.classList.remove('hide-for-exif'); }
    else { motionBtns.classList.add('hide-for-exif'); motionBtns.classList.remove('shift-for-exif'); }
  }
});
window.addEventListener('beforeunload', e => {
  if (pendingUploads.length > 0 && !pendingUploads.every(u => u.saved)) { e.preventDefault(); e.returnValue = ''; return ''; }
});

async function boot() {
  try {
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persisted().then(already => { if (!already) navigator.storage.persist().catch(() => {}); }).catch(() => {});
    }
    await openDB();
    state.photos = await idbAll('photos'); state.albums = await idbAll('albums');
    const seeded = await idbGet('settings', 'seeded');
    if (!seeded) {
      const ct = await idbGet('settings', 'sceneTypes');
      state.sceneTypes = ct && Array.isArray(ct.value) && ct.value.length >= 2 ? ct.value : [...DEFAULT_SCENES];
      if (!ct) await idbPut('settings', { key: 'sceneTypes', value: state.sceneTypes });
      await seedData();
      await idbPut('settings', { key: 'seeded', value: true });
      state.photos = await idbAll('photos'); state.albums = await idbAll('albums');
    } else {
      const ct = await idbGet('settings', 'sceneTypes');
      state.sceneTypes = ct && Array.isArray(ct.value) && ct.value.length >= 2 ? ct.value : [...DEFAULT_SCENES];
      if (!ct) await idbPut('settings', { key: 'sceneTypes', value: state.sceneTypes });
    }
    const simSetting = await idbGet('settings', 'filmSim');
    if (simSetting) { LB.filmSim = simSetting.value; state.settings.filmSim = simSetting.value; }
    const hs = await idbGet('settings', 'homeSort');
    if (hs) state.settings.homeSort = hs.value;
    const tr = await idbGet('settings', 'trashRetentionDays');
    if (tr) state.settings.trashRetentionDays = tr.value;
    let migrated = false;
    for (const p of state.photos) {
      if (p.id.startsWith('seed-') && p.scene === undefined) {
        const seed = SEED_PHOTOS.find(s => 'seed-' + s.s === p.id);
        if (seed) { p.scene = seed.scene || null; p.updatedAt = Date.now(); await idbPut('photos', p); migrated = true; }
      }
      if (p.deletedAt === undefined) { p.deletedAt = null; migrated = true; }
      if (p.restoredAt === undefined) { p.restoredAt = null; migrated = true; }
      if (p.featuredIn === undefined) { p.featuredIn = []; migrated = true; }
      if (p.extraAlbumIds === undefined) { p.extraAlbumIds = []; migrated = true; }
      if (p.kind && p.kind !== 'photo' && p.kind !== 'polaroid' && p.kind !== 'live' && p.kind !== 'film') { p.kind = 'photo'; migrated = true; }
    }
    if (migrated) state.photos = await idbAll('photos');
    await cleanupExpiredTrash();
  } catch (err) { console.error('初始化失败', err); toast('本地存储初始化失败，可能处于隐私模式'); }
  initLongPressHalo();
  route();
  const { params } = parseHash();
  const photoId = params.get('photo');
  if (photoId) { const list = visiblePhotos().map(p => p.id); const idx = list.indexOf(photoId); if (idx >= 0) setTimeout(() => openLightbox(list, idx), 400); }
}
boot();
</script>
