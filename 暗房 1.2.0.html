function currentLbPhoto() { return getPhoto(LB.ids[LB.index]); }

function clampPan() {
  if (LB.zoom <= 1.001) { LB.panX = 0; LB.panY = 0; return; }
  const img = $('#lbImg'); const frame = $('#lbFrame');
  if (!img || !frame || !img.naturalWidth) return;
  const imgRatio = img.naturalWidth / img.naturalHeight;
  const frameRatio = frame.clientWidth / frame.clientHeight;
  let dw, dh;
  if (imgRatio > frameRatio) { dw = frame.clientWidth; dh = dw / imgRatio; }
  else { dh = frame.clientHeight; dw = dh * imgRatio; }
  const maxX = Math.max(0, (dw * LB.zoom - frame.clientWidth) / 2);
  const maxY = Math.max(0, (dh * LB.zoom - frame.clientHeight) / 2);
  LB.panX = Math.max(-maxX, Math.min(maxX, LB.panX));
  LB.panY = Math.max(-maxY, Math.min(maxY, LB.panY));
}
function applyZoom(transitionType = 'none') {
  const img = $('#lbImg'); if (!img) return;
  const dur = transitionType === 'wheel' ? '.15s' : transitionType === 'smooth' ? '.3s' : '0s';
  img.style.setProperty('--zoom-dur', dur);
  if (LB.zoom <= 1.001 && Math.abs(LB.panX) < 0.5 && Math.abs(LB.panY) < 0.5) { img.style.transform = ''; img.classList.remove('zoomed'); }
  else { img.style.transform = `translate(${LB.panX}px, ${LB.panY}px) scale(${LB.zoom})`; img.classList.add('zoomed'); }
}
function resetZoom(animate = false) {
  LB.zoom = 1; LB.panX = 0; LB.panY = 0; LB.isPanning = false;
  LB.pinchStartDist = 0; LB.pinchStartZoom = 1;
  applyZoom(animate ? 'smooth' : 'none');
}
function setZoom(newZoom, centerX, centerY, transitionType = 'wheel') {
  const img = $('#lbImg'); if (!img) return;
  if (LB.motion) { stopMotion(); toast('缩放时动效已暂停'); }
  newZoom = Math.max(1, Math.min(4, newZoom));
  if (Math.abs(newZoom - LB.zoom) < 0.001) return;
  const stage = $('#lbStage'); const stageRect = stage.getBoundingClientRect();
  const mx = centerX - (stageRect.left + stageRect.width / 2);
  const my = centerY - (stageRect.top + stageRect.height / 2);
  const scaleDiff = newZoom / LB.zoom;
  LB.panX = mx - (mx - LB.panX) * scaleDiff;
  LB.panY = my - (my - LB.panY) * scaleDiff;
  LB.zoom = newZoom;
  if (LB.zoom <= 1.001) { LB.zoom = 1; LB.panX = 0; LB.panY = 0; }
  clampPan(); applyZoom(transitionType);
}

function startParticleEffect(img) {
  const canvas = $('#lbParticleCanvas'); const frame = $('#lbFrame');
  if (!canvas || !frame) return false;
  if (!img.naturalWidth) { toast('图片还在加载…'); return false; }

  const dpr = window.devicePixelRatio || 1;
  const rect = frame.getBoundingClientRect();
  canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
  canvas.style.width = rect.width + 'px'; canvas.style.height = rect.height + 'px';
  canvas.style.display = 'block';
  particleCtx = canvas.getContext('2d');
  particleCtx.scale(dpr, dpr);
  img.style.opacity = '0';

  const offCanvas = document.createElement('canvas');
  offCanvas.width = img.naturalWidth; offCanvas.height = img.naturalHeight;
  const offCtx = offCanvas.getContext('2d');
  offCtx.drawImage(img, 0, 0);

  particles = [];
  let data;
  try { data = offCtx.getImageData(0, 0, offCanvas.width, offCanvas.height).data; }
  catch (err) { toast('外链图片不支持 3D 粒子效果，请重新上传'); stopParticleEffect(); return false; }

  const targetCount = 30000;
  const step = Math.max(1, Math.round(Math.sqrt((img.naturalWidth * img.naturalHeight) / targetCount)));
  const scaleToFit = Math.min(rect.width / img.naturalWidth, rect.height / img.naturalHeight) * 0.85;

  for (let y = 0; y < offCanvas.height; y += step) {
    for (let x = 0; x < offCanvas.width; x += step) {
      const i = (y * offCanvas.width + x) * 4;
      if (data[i + 3] > 0) {
        particles.push({
          baseX: (x - img.naturalWidth / 2) * scaleToFit,
          baseY: (y - img.naturalHeight / 2) * scaleToFit,
          z: (Math.random() - 0.5) * 50,
          r: data[i], g: data[i+1], b: data[i+2],
          size: Math.random() * 2.5 + 1.2
        });
      }
    }
  }

  particleTargetAngle = { x: 0, y: 0 };
  particleCurrentAngle = { x: 0, y: 0 };
  particleVelocity = { x: 0, y: 0 };
  let startX = 0, startY = 0, isDragged = false;

  canvas.onpointerdown = e => {
    isDraggingParticle = true; isDragged = false;
    startX = e.clientX; startY = e.clientY;
    lastMousePos = { x: e.clientX, y: e.clientY };
    canvas.setPointerCapture(e.pointerId);
  };
  canvas.onpointermove = e => {
    if (!isDraggingParticle) return;
    const dx = e.clientX - startX; const dy = e.clientY - startY;
    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) isDragged = true;
    const moveX = e.clientX - lastMousePos.x;
    const moveY = e.clientY - lastMousePos.y;
    particleVelocity.x = moveY * 0.005;
    particleVelocity.y = moveX * 0.005;
    particleTargetAngle.x += particleVelocity.x;
    particleTargetAngle.y += particleVelocity.y;
    lastMousePos = { x: e.clientX, y: e.clientY };
  };
  canvas.onpointerup = e => {
    isDraggingParticle = false;
    try { canvas.releasePointerCapture(e.pointerId); } catch(err){}
    const dx = e.clientX - startX; const dy = e.clientY - startY;
    if (!isDragged) { e.stopPropagation(); stopMotion(); }
    else if (dy > 80 && Math.abs(dy) > Math.abs(dx)) { stopMotion(); }
  };
  canvas.ontouchstart = e => e.stopPropagation();
  canvas.ontouchmove = e => e.stopPropagation();
  canvas.ontouchend = e => e.stopPropagation();
  canvas.onwheel = e => { e.preventDefault(); e.stopPropagation(); };

  let lastDrawnAngleX = null;
  let lastDrawnAngleY = null;
  let lastRenderWasRect = false;

  function render() {
    if (!particleCtx) return;
    if (!isDraggingParticle) {
      particleVelocity.x *= 0.95;
      particleVelocity.y *= 0.95;
      particleTargetAngle.x += particleVelocity.x;
      particleTargetAngle.y += particleVelocity.y;
    }
    particleCurrentAngle.x += (particleTargetAngle.x - particleCurrentAngle.x) * 0.1;
    particleCurrentAngle.y += (particleTargetAngle.y - particleCurrentAngle.y) * 0.1;

    const angleChanged = lastDrawnAngleX === null ||
      Math.abs(particleCurrentAngle.x - lastDrawnAngleX) > 0.0005 ||
      Math.abs(particleCurrentAngle.y - lastDrawnAngleY) > 0.0005;

    if (!angleChanged && !lastRenderWasRect) {
      particleAnimId = requestAnimationFrame(render);
      return;
    }

    lastDrawnAngleX = particleCurrentAngle.x;
    lastDrawnAngleY = particleCurrentAngle.y;

    const isFastMoving = isDraggingParticle ||
      Math.abs(particleVelocity.x) > 0.001 ||
      Math.abs(particleVelocity.y) > 0.001;
    lastRenderWasRect = isFastMoving;

    const cosX = Math.cos(particleCurrentAngle.x);
    const sinX = Math.sin(particleCurrentAngle.x);
    const cosY = Math.cos(particleCurrentAngle.y);
    const sinY = Math.sin(particleCurrentAngle.y);
    const cx = rect.width / 2;
    const cy = rect.height / 2;
    particleCtx.clearRect(0, 0, rect.width, rect.height);

    for (let p of particles) {
      let x1 = p.baseX;
      let y1 = p.baseY;
      let z1 = p.z;
      let x2 = x1 * cosY - z1 * sinY;
      let z2 = x1 * sinY + z1 * cosY;
      let y2 = y1 * cosX - z2 * sinX;
      let z3 = y1 * sinX + z2 * cosX;
      const fov = 800;
      const scale = fov / (fov + z3);
      const screenX = cx + x2 * scale;
      const screenY = cy + y2 * scale;
      particleCtx.fillStyle = `rgba(${p.r},${p.g},${p.b},${scale * 0.85})`;
      const size = Math.max(0.9, p.size * scale * 0.6);
      if (isFastMoving) {
        particleCtx.fillRect(screenX - size, screenY - size, size * 2, size * 2);
      } else {
        particleCtx.beginPath();
        particleCtx.arc(screenX, screenY, size, 0, Math.PI * 2);
        particleCtx.fill();
      }
    }
    particleAnimId = requestAnimationFrame(render);
  }
  render();
  return true;
}

function stopParticleEffect() {
  if (particleAnimId) { cancelAnimationFrame(particleAnimId); particleAnimId = null; }
  particleCtx = null; particles = [];
  const canvas = $('#lbParticleCanvas');
  if (canvas) {
    canvas.style.display = 'none';
    canvas.onpointerdown = null; canvas.onpointermove = null; canvas.onpointerup = null;
    canvas.ontouchstart = null; canvas.ontouchmove = null; canvas.ontouchend = null;
    canvas.onwheel = null;
  }
  const img = $('#lbImg'); if (img) img.style.opacity = '1';
}

function doApplyMotion(id) {
  stopMotion();
  const img = $('#lbImg'); if (!img) return;
  if (id === 'particle') {
    const ok = startParticleEffect(img);
    if (!ok) return;
  } else {
    const m = MOTION_LIST.find(x => x.id === id);
    if (!m || !m.cls) return;
    img.classList.add(m.cls);
  }
  LB.motion = id;
  const btn = $('.lb-btn[data-lb="motion"]');
  if (btn) { btn.textContent = '动效 ∞'; btn.classList.add('active'); }
  const motionBtns = $('#lbMotionBtns');
  const resetBtn = $('#lbResetRotation');
  if (motionBtns) {
    if (exitBtnTimer) { clearTimeout(exitBtnTimer); exitBtnTimer = null; }
    motionBtns.classList.remove('shift-for-exif', 'hide-for-exif');
    if (LB.exifOpen && window.innerWidth > 860) motionBtns.classList.add('shift-for-exif');
    if (LB.exifOpen && window.innerWidth <= 860) motionBtns.classList.add('hide-for-exif');
    motionBtns.classList.add('show');
  }
  if (resetBtn) resetBtn.style.display = (id === 'particle') ? '' : 'none';
  toast(id === 'particle' ? '动效 · 星尘浮现（可拖动旋转）' : '动效 · ' + MOTION_LIST.find(x=>x.id===id).name + '（循环播放中）');
}

function applyMotion(id) {
  if (LB.motionPending) { clearTimeout(LB.motionPending); LB.motionPending = null; }
  const needsReset = LB.zoom > 1.001 || Math.abs(LB.panX) > 0.5 || Math.abs(LB.panY) > 0.5;
  if (needsReset) {
    stopMotion(); resetZoom(true);
    LB.motionPending = setTimeout(() => { LB.motionPending = null; doApplyMotion(id); }, 320);
  } else doApplyMotion(id);
}

function stopMotion() {
  if (LB.motionPending) { clearTimeout(LB.motionPending); LB.motionPending = null; }
  stopParticleEffect();
  const img = $('#lbImg');
  if (img) { MOTION_LIST.forEach(m => { if (m.cls) img.classList.remove(m.cls); }); img.style.transform = ''; img.style.opacity = ''; }
  LB.motion = null;
  const btn = $('.lb-btn[data-lb="motion"]');
  if (btn) { btn.textContent = '动效'; btn.classList.remove('active'); }
  const motionBtns = $('#lbMotionBtns');
  if (motionBtns) {
    motionBtns.classList.remove('show', 'hide-for-exif');
    if (exitBtnTimer) clearTimeout(exitBtnTimer);
    exitBtnTimer = setTimeout(() => { motionBtns.classList.remove('shift-for-exif'); exitBtnTimer = null; }, 350);
  }
  const resetBtn = $('#lbResetRotation');
  if (resetBtn) resetBtn.style.display = 'none';
}

function renderLightbox(animate) {
  const p = currentLbPhoto(); if (!p) return;
  const frame = $('#lbFrame');
  const isVideo = p.kind === 'live';
  const src = isVideo ? videoSrc(p) : photoSrc(p);
  const simClass = LB.filmSim !== 'original' ? ' sim-' + LB.filmSim : '';
  stopParticleEffect();
  if (isVideo) {
    frame.innerHTML = `<video class="lb-video${simClass}" id="lbVideo" src="${esc(src)}" controls playsinline loop muted autoplay></video>`;
  } else {
    frame.innerHTML = `<img class="lb-img${simClass}" id="lbImg" src="${esc(src)}" alt="${esc(p.title)}" draggable="false"><canvas id="lbParticleCanvas" class="lb-particle-canvas"></canvas>`;
  }
  if (animate) { frame.classList.remove('develop'); void frame.offsetWidth; frame.classList.add('develop'); }
  const imgEl = isVideo ? $('#lbVideo') : $('#lbImg');

  const restoreMotion = () => {
    if (isVideo || !LB.motion) return;
    if (LB.motion === 'particle') startParticleEffect(imgEl);
    else { const m = MOTION_LIST.find(x => x.id === LB.motion); if (m && m.cls) imgEl.classList.add(m.cls); }
  };

  if (!isVideo && imgEl) {
    imgEl.addEventListener('dblclick', e => {
      e.preventDefault();
      if (LB.motion === 'particle') return;
      if (LB.zoom > 1.001) resetZoom(true); else setZoom(2, e.clientX, e.clientY, 'smooth');
      frame.classList.remove('bump'); void frame.offsetWidth; frame.classList.add('bump');
    });
    imgEl.addEventListener('click', e => {
      if (LB.motion === 'particle') return;
      if (LB.exifOpen && LB.zoom <= 1.001) { e.stopPropagation(); closeExifPanel(); return; }
      if (window.innerWidth <= 860 && LB.zoom <= 1.001) { e.stopPropagation(); closeMenus(); LB.uiHidden = !LB.uiHidden; lbEl.classList.toggle('ui-hidden', LB.uiHidden); }
    });
    imgEl.addEventListener('pointerdown', e => {
      if (e.pointerType === 'touch') return;
      if (LB.zoom <= 1.001) return;
      if (LB.isPanning) return;
      if (LB.motion) stopMotion();
      LB.isPanning = true;
      LB.panStartX = e.clientX - LB.panX;
      LB.panStartY = e.clientY - LB.panY;
      try { imgEl.setPointerCapture(e.pointerId); } catch(err) {}
    });
    imgEl.addEventListener('pointermove', e => {
      if (e.pointerType === 'touch') return;
      if (!LB.isPanning) return;
      e.preventDefault();
      LB.panX = e.clientX - LB.panStartX;
      LB.panY = e.clientY - LB.panStartY;
      clampPan(); applyZoom('none');
    });
    const endPan = e => {
      if (e.pointerType === 'touch') return;
      if (!LB.isPanning) return;
      LB.isPanning = false;
      try { imgEl.releasePointerCapture(e.pointerId); } catch(err) {}
    };
    imgEl.addEventListener('pointerup', endPan);
    imgEl.addEventListener('pointercancel', endPan);
  }
  if (imgEl && !isVideo) {
    if (imgEl.complete) { clampPan(); applyZoom('none'); restoreMotion(); }
    else { imgEl.onload = () => { clampPan(); applyZoom('none'); restoreMotion(); }; imgEl.onerror = () => { if (LB.motion) stopMotion(); }; }
  }

  const isTrashed = !!p.deletedAt;
  const desktopTools = document.querySelector('.lb-tools');
  const mobileTools = document.querySelector('.lb-mobile-tools');
  if (desktopTools) {
    ['fav', 'motion', 'edit', 'story', 'slideshow', 'more'].forEach(a => {
      const btn = desktopTools.querySelector(`[data-lb="${a}"]`);
      if (btn) btn.style.display = isTrashed ? 'none' : '';
    });
    ['copyimg', 'restore', 'permDelete'].forEach(a => {
      const btn = desktopTools.querySelector(`[data-lb="${a}"]`);
      if (btn) btn.style.display = isTrashed ? '' : 'none';
    });
  }
  if (mobileTools) {
    ['fav', 'story', 'edit'].forEach(a => {
      const btn = mobileTools.querySelector(`[data-lb="${a}"]`);
      if (btn) btn.style.display = isTrashed ? 'none' : '';
    });
    ['copyimg', 'restore', 'permDelete'].forEach(a => {
      const btn = mobileTools.querySelector(`[data-lb="${a}"]`);
      if (btn) btn.style.display = isTrashed ? '' : 'none';
    });
  }

  $('#lbName').textContent = p.title || '未命名';
  $('#lbName').title = p.title || '';
  $('#lbCounter').textContent = `${pad2(LB.index + 1)} / ${pad2(LB.ids.length)}`;
  if (!isTrashed) $$('[data-lb="fav"]').forEach(b => { b.textContent = p.favorite ? '收藏 ✓' : '收藏'; b.classList.toggle('on', !!p.favorite); });
  const filmBtn = $('.lb-btn[data-lb="film"]');
  filmBtn.classList.toggle('active', LB.filmSim !== 'original');
  const slideBtn = $('.lb-btn[data-lb="slideshow"]');
  slideBtn.textContent = LB.slideshow ? '暂停' : '幻灯片';
  slideBtn.classList.toggle('active', LB.slideshow);
  $('.lb-btn[data-lb="exif"]').classList.toggle('active', LB.exifOpen);
  $('#lbExif').classList.toggle('open', LB.exifOpen);
  const motionBtn = $('.lb-btn[data-lb="motion"]');
  if (motionBtn) {
    motionBtn.disabled = isVideo;
    motionBtn.title = isVideo ? '视频无需动效' : '选择动效';
    motionBtn.textContent = LB.motion ? '动效 ∞' : '动效';
    motionBtn.classList.toggle('active', !!LB.motion);
  }
  if (!LB.motion) {
    const motionBtns = $('#lbMotionBtns');
    if (motionBtns) motionBtns.classList.remove('show', 'shift-for-exif', 'hide-for-exif');
    const resetBtn = $('#lbResetRotation');
    if (resetBtn) resetBtn.style.display = 'none';
  }
  if (!isTrashed) {
    const inStory = (p.featuredIn || []).includes('story') || p.kind === 'polaroid';
    $$('[data-lb="story"]').forEach(btn => { btn.style.display = inStory ? '' : 'none'; });
  }
  renderExif(p);
  const album = albumOf(p);
  const tags = (p.tags || []).map(t => `<span class="tag-pill">${esc(t)}</span>`).join('');
  $('#lbInfo').innerHTML = `
    <span class="li-title">${esc(p.title || '未命名')}</span>
    <span class="li-dot">·</span><span class="li-meta">${esc(p.date || '—')}</span>
    ${p.place ? `<span class="li-dot">·</span><span class="li-meta">${esc(p.place)}</span>` : ''}
    ${album ? `<span class="li-dot">·</span><span class="li-meta">${esc(album.name)}</span>` : ''}
    ${tags}
    <span class="li-dot">·</span><span class="li-meta">${pad2(LB.index + 1)}/${pad2(LB.ids.length)}</span>`;
  const prevBtn = $('.lb-prev'); const nextBtn = $('.lb-next');
  if (prevBtn) prevBtn.style.display = LB.ids.length > 1 ? '' : 'none';
  if (nextBtn) nextBtn.style.display = LB.ids.length > 1 ? '' : 'none';
}

function renderExif(p) {
  const e = p.exif || {};
  const hasExif = e && (e.camera || e.lens || e.iso || e.aperture || e.shutter || e.focal);
  const blobSize = p.blob ? p.blob.size : (p.videoBlob ? p.videoBlob.size : 0);
  const sizeStr = !blobSize ? '—' : blobSize < 1024 * 1024 ? (blobSize / 1024).toFixed(0) + ' KB' : (blobSize / 1024 / 1024).toFixed(2) + ' MB';
  const album = albumOf(p);
  const uploadTime = p.createdAt ? new Date(p.createdAt).toLocaleString('zh-CN') : '—';
  const tagStr = (p.tags || []).join(' / ') || '—';
  const rows = [];
  if (hasExif) rows.push(['相机', e.camera], ['镜头', e.lens], ['ISO', e.iso], ['光圈', e.aperture], ['快门', e.shutter], ['焦距', e.focal]);
  else rows.push(['EXIF', '无（压缩/外链）']);
  rows.push(['尺寸比', (Number(p.ratio) || 1.3).toFixed(2)], ['文件大小', sizeStr], ['相册', album ? album.name : '未归类'], ['标签', tagStr], ['上传', uploadTime], ['类型', p.kind === 'polaroid' ? '拍立得' : p.kind === 'film' ? '胶卷' : p.kind === 'live' ? '视频' : '普通照片']);
  $('#lbExifList').innerHTML = rows.map(([k, v]) => `<div class="exif-row"><dt>${k}</dt><dd>${esc(v || '—')}</dd></div>`).join('');
}

function lbGo(delta) {
  if (!LB.ids.length) return;
  closeMenus(); stopMotion(); resetZoom(false);
  LB.wasPinching = false; closeExifPanel();
  LB.index = (LB.index + delta + LB.ids.length) % LB.ids.length;
  renderLightbox(true);
  if (LB.slideshow) { clearTimeout(LB.timer); startProgress(); LB.timer = setTimeout(nextSlide, 4000); }
}

lbEl.addEventListener('click', e => {
  const btn = e.target.closest('[data-lb]');
  if (btn) { e.stopPropagation(); handleLbAction(btn.dataset.lb); return; }
  if (e.target.closest('.lb-exif')) return;
  if (LB.exifOpen) { closeExifPanel(); closeMenus(); return; }
  closeMenus();
  if (e.target.id === 'lbStage' || e.target.classList.contains('lb-frame')) closeLightbox();
});

$('#lbStage').addEventListener('wheel', e => {
  e.preventDefault();
  if (LB.motion === 'particle') return;
  const delta = e.deltaY > 0 ? -0.15 : 0.15;
  setZoom(LB.zoom + delta, e.clientX, e.clientY);
}, { passive: false });

let touchStartX = 0, touchStartY = 0, touchLastX = 0, touchLastY = 0, touching = false;
$('#lbStage').addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    LB.wasPinching = true;
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    LB.pinchStartDist = Math.sqrt(dx * dx + dy * dy); LB.pinchStartZoom = LB.zoom; touching = false;
  } else if (e.touches.length === 1) {
    LB.wasPinching = false;
    touchStartX = touchLastX = e.touches[0].clientX;
    touchStartY = touchLastY = e.touches[0].clientY;
    touching = true;
  }
}, { passive: true });
$('#lbStage').addEventListener('touchmove', e => {
  if (e.touches.length === 2) {
    e.preventDefault();
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (LB.pinchStartDist > 0) {
      const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      setZoom(LB.pinchStartZoom * (dist / LB.pinchStartDist), cx, cy, 'none');
    }
  } else if (e.touches.length === 1 && LB.zoom > 1.001 && touching) {
    e.preventDefault();
    LB.panX += e.touches[0].clientX - touchLastX;
    LB.panY += e.touches[0].clientY - touchLastY;
    touchLastX = e.touches[0].clientX; touchLastY = e.touches[0].clientY;
    clampPan(); applyZoom('none');
  }
}, { passive: false });
$('#lbStage').addEventListener('touchend', e => {
  if (e.touches.length === 1) {
    LB.wasPinching = false; touching = true;
    touchStartX = touchLastX = e.touches[0].clientX;
    touchStartY = touchLastY = e.touches[0].clientY;
    LB.pinchStartDist = 0; return;
  }
  if (e.touches.length === 0) {
    if (LB.wasPinching) { LB.wasPinching = false; touching = false; return; }
    if (LB.zoom > 1.001) { touching = false; return; }
    if (!touching) return;
    touching = false;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)) lbGo(dx < 0 ? 1 : -1);
    else if (dy > 90 && Math.abs(dy) > Math.abs(dx)) closeLightbox();
  }
}, { passive: true });

document.addEventListener('keydown', e => {
  if (!lbEl.classList.contains('open')) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if (activeModals.length) return;
  if (activeMenus.length) { if (e.key === 'Escape') { closeMenus(); e.preventDefault(); } return; }
  switch (e.key) {
    case 'ArrowLeft': lbGo(-1); break;
    case 'ArrowRight': lbGo(1); break;
    case 'Escape': if (LB.motion) stopMotion(); else closeLightbox(); break;
    case 'f': case 'F': handleLbAction('fav'); break;
    case 'd': case 'D': handleLbAction('download'); break;
    case 'i': case 'I': handleLbAction('exif'); break;
    case ' ': e.preventDefault(); handleLbAction('slideshow'); break;
  }
});

async function handleLbAction(action) {
  const p = currentLbPhoto(); if (!p) return;
  switch (action) {
    case 'close': closeLightbox(); break;
    case 'prev': lbGo(-1); break;
    case 'next': lbGo(1); break;
    case 'fav': await toggleFavorite(p.id); renderLightbox(false); break;
    case 'download': downloadPhoto(p); break;
    case 'share': sharePhoto(p); break;
    case 'copyimg': copyImage(p); break;
    case 'edit': openEditDialog(p, () => { renderLightbox(false); refreshCurrentView(); }); break;
    case 'story': {
      const inStory = (p.featuredIn || []).includes('story') || p.kind === 'polaroid';
      if (!inStory) { toast('只有故事墙中的照片可以写故事'); break; }
      openStoryEditor(p); break;
    }
    case 'retouch': openRetouchEditor(p); break;
    case 'restore': if (!p.deletedAt) { toast('这张照片不在回收站'); break; } openRestoreDialog(p.id); break;
    case 'permDelete': {
      if (!p.deletedAt) { toast('这张照片不在回收站'); break; }
      openConfirmDialog('彻底删除', `此操作不可撤销，确定永久删除《${p.title || '未命名'}》吗？`, async () => {
        const deleted = await permanentDelete(p.id, true);
        const msg = formatAlbumDeletionMsg('已永久删除', Array.isArray(deleted) ? deleted : []);
        toast(msg); refreshCurrentView();
      });
      break;
    }
    case 'film': {
      const i = FILM_SIMS.indexOf(LB.filmSim);
      LB.filmSim = FILM_SIMS[(i + 1) % FILM_SIMS.length];
      state.settings.filmSim = LB.filmSim;
      idbPut('settings', { key: 'filmSim', value: LB.filmSim });
      const el = p.kind === 'live' ? $('#lbVideo') : $('#lbImg');
      if (el) el.className = (p.kind === 'live' ? 'lb-video' : 'lb-img') + (LB.filmSim !== 'original' ? ' sim-' + LB.filmSim : '') + (LB.motion ? ' ' + (MOTION_LIST.find(x=>x.id===LB.motion)?.cls||'') : '');
      $('.lb-btn[data-lb="film"]').classList.toggle('active', LB.filmSim !== 'original');
      toast('胶片模拟 · ' + FILM_LABEL[LB.filmSim]); break;
    }
    case 'motion': {
      const r = $('.lb-btn[data-lb="motion"]').getBoundingClientRect();
      openMotionMenu(r.left - 80, r.bottom + 8); break;
    }
    case 'slideshow': toggleSlideshow(); break;
    case 'fullscreen': toggleFullscreen(); break;
    case 'exif': {
      closeMenus();
      LB.exifOpen = !LB.exifOpen;
      $('.lb-btn[data-lb="exif"]').classList.toggle('active', LB.exifOpen);
      $('#lbExif').classList.toggle('open', LB.exifOpen);
      const motionBtns = $('#lbMotionBtns');
      if (motionBtns && LB.motion) {
        if (window.innerWidth > 860) motionBtns.classList.toggle('shift-for-exif', LB.exifOpen);
        else motionBtns.classList.toggle('hide-for-exif', LB.exifOpen);
      }
      break;
    }
    case 'more': {
      if (p.deletedAt) break;
      if (LB.exifOpen) closeExifPanel();
      const moreBtns = $$('[data-lb="more"]');
      let targetBtn = null;
      for (const b of moreBtns) { const rect = b.getBoundingClientRect(); if (rect.width > 0 && rect.height > 0) { targetBtn = b; break; } }
      if (!targetBtn) break;
      const r = targetBtn.getBoundingClientRect();
      const isTopHalf = (r.top + r.height / 2) < window.innerHeight / 2;
      const anchor = isTopHalf ? 'below' : 'above';
      const anchorY = isTopHalf ? r.bottom : r.top;
      openPhotoMenu(p.id, r.right, anchorY, { anchor, align: 'right', isTrashed: !!p.deletedAt });
      break;
    }
  }
}

function toggleFullscreen() {

async function downloadPhoto(p) {
  try {
    let blob, ext = 'jpg';
    if (p.kind === 'live' && p.videoBlob) { blob = p.videoBlob; ext = 'mp4'; }
    else if (p.blob) blob = p.blob;
    else { const res = await fetch(p.src, { mode: 'cors' }); if (!res.ok) throw new Error('fetch failed'); blob = await res.blob(); }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${(p.title || 'photo').replace(/[\\/:*?"<>|]/g, '_')}.${ext}`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
    toast('已开始下载');
  } catch (err) { toast('下载失败：可能受跨域限制'); }
}
async function sharePhoto(p) {
  const url = location.origin + location.pathname + `#/home?photo=${p.id}`;
  const isLocal = !!p.blob;
  const copyMsg = isLocal ? '链接已复制（照片仅存于本地，对方打开看不到照片）' : '链接已复制';
  const shareText = isLocal ? `${p.title || '照片'}（仅本地可见）` : (p.title || '照片');
  if (navigator.share) { try { await navigator.share({ title: '暗房画廊', text: shareText, url }); return; } catch (e) {} }
  const ok = await copyText(url);
  toast(ok ? copyMsg : '复制失败');
}
async function copyText(text) {
  try { if (navigator.clipboard?.writeText) { await navigator.clipboard.writeText(text); return true; } } catch (e) {}
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.cssText = 'position:fixed;opacity:0;';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    return true;
  } catch (e) { return false; }
}
async function copyImage(p) {
  if (location.protocol === 'file:') return toast('本地文件直接打开无法复制图片，请启动本地服务器访问');
  if (!navigator.clipboard || !window.ClipboardItem) return toast('当前浏览器不支持复制图片');
  try {
    let blob = p.blob;
    if (!blob) {
      try { const res = await fetch(p.src, { mode: 'cors' }); if (!res.ok) throw new Error('fetch failed'); blob = await res.blob(); }
      catch (err) { return toast('图片获取失败，可能受跨域限制'); }
    }
    const item = new ClipboardItem({ [blob.type || 'image/jpeg']: blob });
    await navigator.clipboard.write([item]);
    toast('图片已复制');
  } catch (e) {
    if (e.name === 'NotAllowedError') toast('复制被浏览器拒绝，请检查剪贴板权限');
    else toast('当前浏览器不支持复制图片');
  }
}

function openStoryEditor(p) {
  if (!p) return;
  let editing = false;
  const renderContent = () => {
    if (editing) {
      return `<div class="field" style="margin-bottom:0">
        <label>故事</label>
        <textarea class="input" id="storyArea" style="min-height:180px;line-height:1.9" placeholder="写下这张照片的故事…">${esc(p.note || '')}</textarea>
      </div>`;
    }
    return `<div style="font-family:var(--hand);font-size:15px;line-height:2;color:var(--cream);white-space:pre-wrap;padding:14px 0;min-height:120px;max-height:50vh;overflow-y:auto">${p.note ? esc(p.note) : ''}</div>`;
  };
  const renderActions = () => {
    if (editing) return `<button class="btn-ghost" data-act="cancel">取消</button><button class="btn-primary" data-act="save">保存</button>`;
    return `<button class="btn-ghost" data-act="close">关闭</button><button class="btn-primary" data-act="edit">编辑故事</button>`;
  };
  const { close, root } = makeModal(`
    <h3 style="margin-bottom:14px">${esc(p.title || '未命名')}</h3>
    <div id="storyContent">${renderContent()}</div>
    <div class="modal-actions" id="storyActions">${renderActions()}</div>
  `);
  if (!root) return;
  root.addEventListener('click', async e => {
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (!act) return;
    if (act === 'close' || act === 'cancel') {
      if (editing) { editing = false; root.querySelector('#storyContent').innerHTML = renderContent(); root.querySelector('#storyActions').innerHTML = renderActions(); }
      else close();
      return;
    }
    if (act === 'edit') {
      editing = true;
      root.querySelector('#storyContent').innerHTML = renderContent();
      root.querySelector('#storyActions').innerHTML = renderActions();
      const ta = root.querySelector('#storyArea');
      if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
      return;
    }
    if (act === 'save') {
      const ta = root.querySelector('#storyArea');
      if (!ta) { close(); return; }
      const newNote = ta.value.trim(); const oldNote = p.note;
      p.note = newNote; p.updatedAt = Date.now();
      try { await idbPut('photos', p); toast(newNote ? '故事已保存' : '故事已清空'); close(); refreshCurrentView(); }
      catch (err) { p.note = oldNote; p.updatedAt = Date.now(); toast('保存失败：可能存储已满'); }
    }
  });
}

function openPhotoMenu(id, x, y, opts = {}) {

      items.push(B('retouch', '修图'));
      items.push(B('film', '胶片模拟'));
      items.push(B('slideshow', '幻灯片'));
      items.push(SEP);
      items.push(B('share', '分享链接'));
      items.push(B('fullscreen', '全屏查看'));
      items.push(SEP);

    items.push(B('featureFilmstrip', featureFilmstripLabel));

async function runPhotoAction(action, p) {
  switch (action) {
    case 'view': {
      const pool = p.deletedAt ? state.photos.filter(x => x.deletedAt) : visiblePhotos();
      const list = pool.map(x => x.id);
      const idx = list.indexOf(p.id);
      if (idx >= 0) openLightbox(list, idx);
      break;
    }
    case 'fav': toggleFavorite(p.id); break;
    case 'edit': openEditDialog(p, refreshCurrentView); break;
    case 'retouch': openRetouchEditor(p); break;
    case 'download': downloadPhoto(p); break;
    case 'album': openMoveDialog(p); break;
    case 'cover': await setAsCover(p); break;
    case 'copyimg': copyImage(p); break;
    case 'copylink': {
      const url = location.origin + location.pathname + `#/home?photo=${p.id}`;
      const ok = await copyText(url);
      toast(ok ? '链接已复制' : '复制失败');
      break;
    }
  }
}

/* 12. 模态框 */
let activeModals = [];
function closeAllModals() { activeModals.forEach(m => { try { m.close(); } catch(e){} }); activeModals = []; }
function makeModal(html, opts = {}) {
  if (activeModals.length > 0) {
    activeModals.forEach(m => { try { if (m.mask) { m.mask.classList.remove('open'); setTimeout(() => { try { m.mask.remove(); } catch(e){} }, 50); } } catch(e) {} });
    activeModals = [];
  }
  const mask = document.createElement('div');
  mask.className = 'modal-mask';
  mask.innerHTML = `<div class="modal">${html}</div>`;
  document.body.appendChild(mask);
  requestAnimationFrame(() => mask.classList.add('open'));
  let closed = false;
  const close = () => {
    if (closed) return;
    closed = true;
    mask.classList.remove('open');
    setTimeout(() => mask.remove(), 300);
    activeModals = activeModals.filter(m => m.mask !== mask);
    document.removeEventListener('keydown', escHandler);
    opts.onClose && opts.onClose();
  };
  const escHandler = ev => { if (ev.key === 'Escape') close(); };
  document.addEventListener('keydown', escHandler);
  activeModals.push({ mask, close });
  mask.addEventListener('click', e => { if (e.target === mask) close(); });
  mask.addEventListener('wheel', e => { if (!e.target.closest('.modal')) { e.preventDefault(); close(); } }, { passive: false });
  mask.addEventListener('touchmove', e => { if (!e.target.closest('.modal')) { e.preventDefault(); close(); } }, { passive: false });
  return { mask, close, root: mask.querySelector('.modal') };
}

function openDeleteDialog(ids) {
  if (!ids.length) return;
  const isBatch = ids.length > 1;
  const title = isBatch ? `删除 ${ids.length} 张照片` : '删除照片';
  const { close, root } = makeModal(`
    <h3>${esc(title)}</h3>
    <p style="color:var(--muted);font-size:13.5px;line-height:1.9;margin:0 0 6px">你想把它移入回收站，还是永久删除？</p>
    <p style="color:var(--muted);font-size:12px;line-height:1.7;margin:0">移入回收站后可恢复；永久删除不可撤销。</p>
    <div class="modal-actions">
      <button class="btn-ghost" data-act="cancel">取消</button>
      <button class="btn-primary" data-act="trash">移入回收站</button>
      <button class="btn-primary btn-danger" data-act="perm">永久删除</button>
    </div>`);
  if (!root) return;

  const affectedAlbumIds = new Set();
  for (const id of ids) {
    const p = getPhoto(id);
    if (!p) continue;
    if (p.albumId) affectedAlbumIds.add(p.albumId);
    if (Array.isArray(p.extraAlbumIds)) p.extraAlbumIds.forEach(aid => { if (aid) affectedAlbumIds.add(aid); });
  }
  const checkHiddenAlbums = () => {
    const albumPhotoCount = new Map();
    for (const x of state.photos) {
      if (x.deletedAt) continue;
      if (x.albumId) albumPhotoCount.set(x.albumId, (albumPhotoCount.get(x.albumId) || 0) + 1);
      if (Array.isArray(x.extraAlbumIds)) {
        for (const aid of x.extraAlbumIds) {
          if (aid) albumPhotoCount.set(aid, (albumPhotoCount.get(aid) || 0) + 1);
        }
      }
    }
    const hidden = [];
    for (const aid of affectedAlbumIds) {
      if (!albumPhotoCount.has(aid)) {
        const album = state.albums.find(a => a.id === aid);
        if (album) hidden.push(album.name);
      }
    }
    return hidden;
  };

  root.addEventListener('click', async e => {
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (!act) return;
    if (act === 'cancel') { close(); return; }
    if (act === 'trash') {
      const inSelect = state.selectMode;
      close();
      for (const id of ids) await moveToTrash(id, true);
      const hidden = checkHiddenAlbums();
      let msg = isBatch ? `已移入回收站 ${ids.length} 张` : '已移入回收站';
      msg = formatAlbumHiddenMsg(msg, hidden);
      toast(msg);
      if (inSelect) exitSelectMode();
      refreshCurrentView();
      return;
    }
    if (act === 'perm') {
      const inSelect = state.selectMode;
      close();
      setTimeout(() => {
        openConfirmDialog('永久删除',
          `此操作不可撤销，确定永久删除 ${ids.length} 张照片吗？如果某些相册的所有照片都在回收站里，相册也会被彻底删除。`,
          async () => {
            const allFullyDeleted = new Set();
            for (const id of ids) {
              const deleted = await permanentDelete(id, true);
              if (Array.isArray(deleted)) deleted.forEach(name => allFullyDeleted.add(name));
            }
            const hidden = checkHiddenAlbums();
            let msg = isBatch ? `已永久删除 ${ids.length} 张` : '已永久删除';
            msg = formatAlbumDeletionMsg(msg, [...allFullyDeleted]);
            msg = formatAlbumHiddenMsg(msg, hidden);
            toast(msg);
            if (inSelect) exitSelectMode();
            refreshCurrentView();
          });
      }, 320);
    }
  });
}

    root.addEventListener('click', async ev => {
      const f = ev.target.closest('[data-f]')?.dataset.f;

/* 14. 首页 */
function pickTodayPhoto(list) { if (!list.length) return null; return list[Math.floor(Date.now() / 86400000) % list.length]; }
function pickHomeStory(all) {
  const manual = all.filter(p => (p.featuredIn || []).includes('story'));
  const excluded = new Set(manual.map(p => p.id));
  const auto = all.filter(p => p.kind === 'polaroid' && !excluded.has(p.id));
  return [...sortPhotos(manual, 'newest'), ...sortPhotos(auto, 'newest')];
}
function pickFilmstripPhotos(list) {
  const now = Date.now(); const thirtyDays = 30 * 86400000;
  const filmOnly = list.filter(p => p.kind === 'film'); const photoOnly = list.filter(p => p.kind === 'photo');
  const filmPicked = sortPhotos(filmOnly, 'newest').slice(0, 12);
  if (filmPicked.length >= 12) return filmPicked;
  const need = 12 - filmPicked.length;
  const seen = new Set(filmPicked.map(p => p.id));
  const recent = photoOnly.filter(p => { const t = p.createdAt || (p.date ? new Date(p.date).getTime() : 0); return now - t < thirtyDays && !seen.has(p.id); });
  const photoPicked = [];
  recent.forEach(p => { if (photoPicked.length < need) photoPicked.push(p); });
  if (photoPicked.length < need) {
    const sorted = sortPhotos(photoOnly, 'newest');
    for (const p of sorted) { if (photoPicked.length >= need) break; if (!seen.has(p.id)) { photoPicked.push(p); seen.add(p.id); } }
  }
  return [...filmPicked, ...photoPicked];
}
function pickHomeFilmstrip(all) {
  const sceneFilter = __homeSceneFilter;
  let pool = sceneFilter ? all.filter(p => p.scene === sceneFilter) : all;
  const manual = pool.filter(p => (p.featuredIn || []).includes('filmstrip'));
  const manualIdSet = new Set(manual.map(p => p.id));
  const flagSet = new Set(state.albums.filter(a => a.showOnFilmstrip).map(a => a.id));
  const fromAlbums = pool.filter(p => !manualIdSet.has(p.id) && albumsOf(p).some(a => flagSet.has(a.id)));
  const excludedIdSet = new Set([...manual, ...fromAlbums].map(p => p.id));
  const auto = pickFilmstripPhotos(pool.filter(p => !excludedIdSet.has(p.id)));
  return [...manual, ...fromAlbums, ...auto].slice(0, 12);
}

function openHomeFeaturePicker(flag) {
  const flagName = flag === 'filmstrip' ? '胶卷精选' : '故事墙';
  const all = visiblePhotos();
  if (!all.length) return toast('还没有照片');
  const flagSet = new Set(state.albums.filter(a => a.showOnFilmstrip).map(a => a.id));
  const chosen = new Set(all.filter(p => (p.featuredIn || []).includes(flag)).map(p => p.id));
  const { close, root } = makeModal(`
    <h3>管理${flagName}</h3>

            ${autoFromAlbum && !isChosen ? '<span style="position:absolute;bottom:4px;left:4px;font-size:9px;padding:2px 5px;border-radius:4px;background:rgba(196,106,59,.85);color:#fff;letter-spacing:.06em">相册</span>' : ''}
          </div>`;
      }).join('')}
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" data-act="cancel">取消</button>

    </div>`);
  if (!root) return;
  const grid = root.querySelector('#hmGrid');

  grid.addEventListener('click', e => {
    const cell = e.target.closest('[data-hmid]'); if (!cell) return;

  });

    const act = e.target.closest('[data-act]')?.dataset.act;
    if (!act) return;
    if (act === 'cancel') { close(); return; }
    if (act === 'clearAll') {
      chosen.clear();
      grid.querySelectorAll('[data-hmid]').forEach(c => { c.style.outline = ''; c.querySelector('.hm-check')?.remove(); });
      countEl.textContent = '0'; return;

      close();
      let changed = 0, failed = 0;
      for (const p of all) {

        const want = chosen.has(p.id);

let quickNavScrollHandler = null;
function initQuickNav(photos) {
  const nav = $('#quickNav'); if (!nav) return;
  if (quickNavScrollHandler) { window.removeEventListener('scroll', quickNavScrollHandler); quickNavScrollHandler = null; }
  if (state.selectMode) { nav.classList.remove('visible'); nav.innerHTML = ''; return; }
  nav.innerHTML = '';
  if (window.innerWidth <= 860 || photos.length <= 20) { nav.classList.remove('visible'); return; }
  const CHUNK = 20; const chunks = [];
  for (let i = 0; i < photos.length; i += CHUNK) chunks.push(photos.slice(i, i + CHUNK));
  const dots = [];
  chunks.forEach((chunk, index) => {
    const start = index * CHUNK + 1; const end = Math.min((index + 1) * CHUNK, photos.length);
    const dot = document.createElement('div');
    dot.className = 'qn-dot';
    dot.innerHTML = `<div class="qn-tooltip">${start}-${end}</div>`;
    dot.addEventListener('click', () => {
      const card = document.querySelector(`.photo-card[data-id="${chunk[0].id}"]`);
      if (card) smoothScrollTo(card.offsetTop - 100, 800);
    });
    nav.appendChild(dot); dots.push({ el: dot, firstId: chunk[0].id });
  });
  nav.classList.add('visible');
  quickNavScrollHandler = () => {
    let activeIndex = 0; const wall = $('#wall'); if (!wall) return;
    const cards = Array.from(wall.querySelectorAll('.photo-card')); if (!cards.length) return;
    const scrollMid = window.scrollY + window.innerHeight / 3;
    for (let i = 0; i < dots.length; i++) {
      const card = document.querySelector(`.photo-card[data-id="${dots[i].firstId}"]`);
      if (card && card.offsetTop <= scrollMid) activeIndex = i; else break;
    }
    dots.forEach((d, i) => d.el.classList.toggle('active', i === activeIndex));
  };
  window.addEventListener('scroll', quickNavScrollHandler, { passive: true });
  quickNavScrollHandler();
}

function hashStr(s) { let h = 0; for (let i = 0; i < String(s).length; i++) h = (h * 31 + String(s).charCodeAt(i)) >>> 0; return h; }

function initAllStrips() {
  $$('.filmstrip').forEach(strip => {
    if (strip.dataset.arrowInit) return;
    strip.dataset.arrowInit = '1';
    const track = strip.querySelector('.film-track');
    const left = strip.querySelector('.film-arrow-left');
    const right = strip.querySelector('.film-arrow-right');
    if (!track) return;
    let pendingScrollTarget = null; let scrollAnimId = null;
    const updateArrows = () => {
      const maxScroll = track.scrollWidth - track.clientWidth;
      if (left) left.disabled = track.scrollLeft <= 1;
      if (right) right.disabled = track.scrollLeft >= maxScroll - 1;
    };
    track.addEventListener('scroll', updateArrows, { passive: true });
    setTimeout(updateArrows, 50);
    const clickMove = (dir) => {
      const maxScroll = track.scrollWidth - track.clientWidth;
      const base = pendingScrollTarget !== null ? pendingScrollTarget : track.scrollLeft;
      const target = Math.max(0, Math.min(maxScroll, base + dir * 160));
      pendingScrollTarget = target;
      if (scrollAnimId) cancelAnimationFrame(scrollAnimId);
      track.style.scrollBehavior = 'auto';
      const start = track.scrollLeft; const dist = target - start;
      if (Math.abs(dist) < 1) { pendingScrollTarget = null; track.style.scrollBehavior = ''; return; }
      const dur = 280; const t0 = performance.now(); const ease = t => 1 - Math.pow(1 - t, 3);
      const tick = t => {
        if (!track.isConnected) { scrollAnimId = null; pendingScrollTarget = null; return; }
        const p = Math.min((t - t0) / dur, 1);
        track.scrollLeft = start + dist * ease(p);
        if (p < 1) scrollAnimId = requestAnimationFrame(tick);
        else { scrollAnimId = null; pendingScrollTarget = null; track.style.scrollBehavior = ''; }
      };
      scrollAnimId = requestAnimationFrame(tick);
    };
    const bindArrow = (btn, dir) => {
      if (!btn) return;
      let holdTimer = null, holdInterval = null;
      btn._didHold = false;
      const startHold = () => {
        if (scrollAnimId) { cancelAnimationFrame(scrollAnimId); scrollAnimId = null; }
        btn._didHold = false;
        holdTimer = setTimeout(() => {
          btn._didHold = true;
          track.style.scrollBehavior = 'auto';
          holdInterval = setInterval(() => {
            const maxNow = track.scrollWidth - track.clientWidth;
            if (dir > 0 && track.scrollLeft >= maxNow - 0.5) { stopHold(); return; }
            if (dir < 0 && track.scrollLeft <= 0.5) { stopHold(); return; }
            track.scrollLeft += dir * 6;
            pendingScrollTarget = track.scrollLeft;
          }, 60);
        }, 300);
      };
      const stopHold = () => {
        clearTimeout(holdTimer); clearInterval(holdInterval);
        holdTimer = holdInterval = null; track.style.scrollBehavior = '';
      };
      btn.addEventListener('pointerdown', e => { e.stopPropagation(); startHold(); });
      btn.addEventListener('pointerup', e => {
        e.stopPropagation();
        const wasHold = btn._didHold;
        stopHold();
        if (!wasHold) clickMove(dir);
      });
      btn.addEventListener('pointercancel', () => { stopHold(); });
      btn.addEventListener('pointerleave', () => { if (holdTimer || holdInterval) stopHold(); });
    };
    bindArrow(left, -1); bindArrow(right, 1);

    let down = false, startX = 0, startScroll = 0, dragged = false;
    track.addEventListener('pointerdown', e => {
      down = true; dragged = false;
      startX = e.clientX; startScroll = track.scrollLeft;
      track.setPointerCapture(e.pointerId);
    });
    track.addEventListener('pointermove', e => {
      if (!down) return;
      const dx = e.clientX - startX;
      if (Math.abs(dx) > 5) {
        if (!dragged) {
          if (scrollAnimId) { cancelAnimationFrame(scrollAnimId); scrollAnimId = null; }
          pendingScrollTarget = null; track.classList.add('dragging');
        }
        dragged = true; track.scrollLeft = startScroll - dx;
      }
    });
    const end = () => { down = false; track.classList.remove('dragging'); setTimeout(() => { dragged = false; }, 30); };
    track.addEventListener('pointerup', end);
    track.addEventListener('pointercancel', end);
    track.addEventListener('click', e => { if (dragged) { e.stopPropagation(); e.preventDefault(); } }, true);
  });
}

  const grid = appRoot.querySelector('.album-grid');

    grid.addEventListener('click', e => {
      if (albumSelectMode) {

        updateAlbumSelectUI(); e.stopPropagation(); e.preventDefault(); return;

      const card = e.target.closest('[data-album]'); if (!card) return;

      if (isAlbumLocked(album)) { askPassword(album); return; }

    }, true);
  }

  else { document.body.classList.remove('album-select-mode'); const bar = $('#albumSelectBar'); if (bar) bar.classList.remove('open'); }
}

$('#albumSelectBar').onclick = async e => {
  const act = e.target.closest('[data-asel]')?.dataset.asel;
  if (!act) return;
  if (act === 'all') {
    const cards = $$('.album-grid .album-card');
    const allSel = cards.length > 0 && cards.every(c => albumSelected.has(c.dataset.album));
    if (allSel) { albumSelected.clear(); cards.forEach(c => c.classList.remove('album-selected')); }
    else { cards.forEach(c => { albumSelected.add(c.dataset.album); c.classList.add('album-selected'); }); }
    updateAlbumSelectUI(); return;
  }
  const ids = [...albumSelected];
  if (!ids.length) return toast('还没有选择相册');
  if (act === 'filmstrip') {
    for (const id of ids) { const a = state.albums.find(x => x.id === id); if (a) { a.showOnFilmstrip = true; try { await idbPut('albums', a); } catch (err) {} } }
    toast(`已设置 ${ids.length} 个相册为首页精选来源`);
    exitAlbumSelect(); renderGallery(); return;
  }
  if (act === 'delete') {
    openConfirmDialog('删除相册', `确定删除选中的 ${ids.length} 个相册吗？相册内照片会保留但不再归属这些相册。`, async () => {
      showUploadProgress('正在删除相册…');
      try {
        for (const id of ids) {
          for (const p of state.photos) {
            if (p.albumId === id) { p.albumId = null; try { await idbPut('photos', p); } catch (e) {} }
            if (p.extraAlbumIds && p.extraAlbumIds.includes(id)) { p.extraAlbumIds = p.extraAlbumIds.filter(x => x !== id); try { await idbPut('photos', p); } catch (e) {} }
          }
          try { await idbDel('albums', id); } catch (e) {}
          state.albums = state.albums.filter(a => a.id !== id);
        }
        toast(`已删除 ${ids.length} 个相册`);
      } finally { hideUploadProgress(); }
      exitAlbumSelect(); renderGallery();
    });
  }
};

function askPassword(album) {
  const { close, root } = makeModal(`
    <h3>🔒 ${esc(album.name)}</h3>
    <p style="color:var(--muted);font-size:13px;line-height:1.8;margin:0 0 18px">这是一个私密相册，请输入密码解锁（本次会话有效）。</p>
    <div class="field"><label>密码</label><input class="input" type="password" id="pwInput" placeholder="请输入密码"></div>
    <div class="modal-actions">
      <button class="btn-ghost" data-act="cancel">取消</button>
      <button class="btn-primary" data-act="ok">解锁</button>
    </div>`);
  if (!root) return;
  setTimeout(() => $('#pwInput', root).focus(), 100);
  root.addEventListener('click', e => {
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'cancel') close();
    if (act === 'ok') {
      const v = $('#pwInput', root).value;
      if (v === album.password) { unlockedAlbums.add(album.id); saveUnlocked(); close(); toast('已解锁'); refreshCurrentView(); }
      else toast('密码不正确');
    }
  });
}
function openAlbumDialog(album) {
  const isNew = !album;
  const { close, root } = makeModal(`
    <h3>${isNew ? '新建相册' : '编辑相册'}</h3>
    <div class="field"><label>相册名称</label><input class="input" id="alName" value="${esc(album ? album.name : '')}" placeholder="例如：川西之行"></div>
    <div class="field"><label>描述</label><textarea class="input" id="alDesc" placeholder="一句话描述这卷胶卷">${esc(album ? album.desc || '' : '')}</textarea></div>
    <div class="field"><label>私密密码（留空则公开）</label><input class="input" id="alPw" type="text" value="${esc(album && album.password ? album.password : '')}" placeholder="可选"></div>
    <div class="modal-actions">
      <button class="btn-ghost" data-act="cancel">取消</button>
      <button class="btn-primary" data-act="save">${isNew ? '创建' : '保存'}</button>
    </div>`);
  if (!root) return;
  root.addEventListener('click', async e => {
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'cancel') close();
    if (act === 'save') {
      const name = $('#alName', root).value.trim();
      if (!name) return toast('请填写相册名称');
      const desc = $('#alDesc', root).value.trim();
      const pw = $('#alPw', root).value.trim();
      if (isNew) {
        const sameName = state.albums.find(a => a.name === name);
        if (sameName) { close(); toast(`已存在同名相册「${name}」，已直接使用`); return; }
        const id = 'al' + Date.now().toString(36);
        await idbPut('albums', { id, name, desc, password: pw || undefined });
        state.albums.push({ id, name, desc, password: pw || undefined });
        toast('相册已创建，上传照片后会显示在列表');
      } else {
        album.name = name; album.desc = desc; album.password = pw || undefined;
        await idbPut('albums', album); toast('相册已更新');
      }
      close(); renderGallery();
    }
  });
}

async function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
}
async function ensureTransformers() {
  if (transformersPipeline) return transformersPipeline;
  if (transformersLoadPromise) return transformersLoadPromise;
  transformersLoadPromise = (async () => {
    try {
      if (!window.transformers) await loadScript('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0');
      const t = window.transformers;
      if (!t || !t.pipeline) throw new Error('transformers 不可用');
      transformersPipeline = await t.pipeline('image-classification', 'Xenova/vit-base-patch16-224', { dtype: 'q8' });
      return transformersPipeline;
    } catch (e) { console.warn('Transformers.js 加载失败', e); return null; }
  })();
  return transformersLoadPromise;
}
async function ensureExifr() {
  if (exifrLib) return exifrLib;
  if (exifrLoadPromise) return exifrLoadPromise;
  exifrLoadPromise = (async () => {
    try {
      if (!window.exifr) { const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('exifr load timeout')), 2000)); await Promise.race([loadScript('https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js'), timeout]); }
      exifrLib = window.exifr; return exifrLib;
    } catch (e) { console.warn('exifr 加载失败', e); return null; }
  })();
  return exifrLoadPromise;
}
function formatShutter(t) { if (!t || t <= 0) return ''; return t >= 1 ? `${t}s` : `1/${Math.round(1/t)}s`; }
function formatAperture(f) { return f ? `f/${Number(f).toFixed(1)}` : ''; }
function formatFocal(f) { return f ? `${Math.round(f)}mm` : ''; }
function formatISO(i) { return i ? `ISO ${i}` : ''; }
function formatCamera(make, model) { const m = (make || '').trim(), mo = (model || '').trim(); if (!mo) return m; if (m && mo.toLowerCase().startsWith(m.toLowerCase())) return mo; return m ? `${m} ${mo}` : mo; }
function readExifSafe(file) {
  const work = ensureExifr().then(exifr => {
    if (!exifr) return null;
    return exifr.parse(file, { pick: ['Make', 'Model', 'LensModel', 'ISO', 'FNumber', 'ExposureTime', 'FocalLength', 'DateTimeOriginal'] }).then(data => {
      if (!data) return null;
      return { camera: formatCamera(data.Make, data.Model), lens: data.LensModel || '', iso: formatISO(data.ISO), aperture: formatAperture(data.FNumber), shutter: formatShutter(data.ExposureTime), focal: formatFocal(data.FocalLength) };
    }).catch(() => null);
  }).catch(() => null);
  return Promise.race([work, new Promise(res => setTimeout(() => res(null), 1500))]);
}

const SCENE_MAP = {
  portrait: ['person', 'face', 'man', 'woman', 'child', 'groom', 'bride', 'suit', 'jersey', 'wig'],
  landscape: ['seashore', 'lakeside', 'mountain', 'valley', 'volcano', 'geyser', 'promontory', 'sandbar', 'cliff', 'coral reef', 'alp', 'fountain'],
  sport: ['racket', 'ball', 'basketball', 'soccer', 'volleyball', 'ski', 'bicycle', 'horse'],
  food: ['pizza', 'sushi', 'espresso', 'plate', 'dish', 'burrito', 'cheeseburger', 'hotdog', 'pretzel', 'bagel', 'guacamole', 'carbonara', 'ice cream', 'trifle', 'custard', 'wine bottle'],
  festival: ['balloon', 'christmas', 'candle', 'jack-o-lantern', 'corn'],
  building: ['castle', 'church', 'monastery', 'palace', 'skyscraper', 'bridge', 'lighthouse', 'dome', 'barn', 'boathouse', 'library', 'mosque', 'planetarium', 'prison', 'stupa', 'triumphal arch'],
  animal: ['dog', 'cat', 'bird', 'fish', 'horse', 'sheep', 'cow', 'elephant', 'bear', 'zebra', 'giraffe', 'penguin', 'snake', 'lizard', 'frog', 'insect', 'butterfly', 'retriever', 'terrier', 'husky', 'tabby', 'siamese', 'parrot', 'goldfish'],
  night: ['street sign', 'traffic light', 'spotlight', 'firework', 'candle'],
  still: ['vase', 'book', 'clock', 'teapot', 'coffee mug', 'flowerpot', 'candle', 'lamp', 'quill', 'typewriter', 'basket'],
  street: ['street sign', 'traffic light', 'manhole', 'crosswalk', 'barber', 'newsstand']
};
function mapImageNetToScene(className) { const c = className.toLowerCase(); for (const [scene, keys] of Object.entries(SCENE_MAP)) { for (const k of keys) if (c.includes(k)) return scene; } return null; }

function heuristicAnalyze(blob) {
  return new Promise(resolve => {
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      try {
        URL.revokeObjectURL(url);
        const size = 64;
        const canvas = document.createElement('canvas'); canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(img, 0, 0, size, size);
        const data = ctx.getImageData(0, 0, size, size).data;
        let rSum = 0, gSum = 0, bSum = 0, satSum = 0, brightSum = 0, brightPts = 0;
        const total = size * size;
        for (let i = 0; i < data.length; i += 4) {
          const r = data[i], g = data[i+1], b = data[i+2];
          rSum += r; gSum += g; bSum += b;
          const max = Math.max(r, g, b), min = Math.min(r, g, b);
          satSum += max === 0 ? 0 : (max - min) / max;
          const br = (r + g + b) / 3; brightSum += br;
          if (br > 220) brightPts++;
        }
        const avgR = rSum / total, avgB = bSum / total;
        const avgSat = satSum / total, avgBright = brightSum / total;
        const ratio = (img.naturalWidth || 1) / (img.naturalHeight || 1);
        const tags = [];
        if (avgSat < 0.08) tags.push('黑白'); else if (avgR - avgB > 22) tags.push('暖调'); else if (avgB - avgR > 22) tags.push('冷调');
        if (avgBright > 180) tags.push('高调'); else if (avgBright < 55) tags.push('低调');
        if (ratio > 1.3) tags.push('横构图'); else if (ratio < 0.77) tags.push('竖构图'); else tags.push('方构图');
        const candidates = [];
        if (avgBright < 55 && brightPts / total > 0.08) candidates.push({ scene: 'night', conf: 0.5, hint: '推测' });
        if (avgR - avgB > 30 && avgSat > 0.4) candidates.push({ scene: 'festival', conf: 0.4, hint: '推测' });
        resolve({ colorTags: tags, candidates, ratio });
      } catch (e) { resolve({ colorTags: [], candidates: [], ratio: 1 }); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve({ colorTags: [], candidates: [], ratio: 1 }); };
    img.src = url;
  });
}

async function analyzeWithLocal(blob) {
  const pipe = await ensureTransformers(); if (!pipe) return null;
  const url = URL.createObjectURL(blob);
  try {
    const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 20000));
    const result = await Promise.race([pipe(url, { topk: 5 }), timeout]);
    const candidates = []; const descCandidates = [];
    (result || []).forEach(r => {
      const sc = mapImageNetToScene(r.label);
      if (sc && !candidates.find(c => c.scene === sc)) candidates.push({ scene: sc, conf: r.score, hint: '' });
      const desc = r.label.split(',')[0].trim();
      if (desc && desc.length < 14 && !descCandidates.includes(desc)) descCandidates.push(desc);
    });
    return { candidates: candidates.slice(0, 3), descCandidates: descCandidates.slice(0, 3) };
  } catch (e) { return null; } finally { URL.revokeObjectURL(url); }
}

async function analyzeImage(blob, opts = {}) {
  const heur = await heuristicAnalyze(blob);
  let candidates = [...heur.candidates]; let descCandidates = []; let source = 'basic';
  if (opts.useLocal) {
    const local = await analyzeWithLocal(blob);
    if (local) {
      source = 'local';
      local.candidates.forEach(c => { if (!candidates.find(x => x.scene === c.scene)) candidates.push(c); });
      local.descCandidates.forEach(d => { if (!descCandidates.includes(d)) descCandidates.push(d); });
    }
  }
  candidates.sort((a, b) => b.conf - a.conf);
  const aiFailed = opts.useLocal && source === 'basic';
  return { colorTags: heur.colorTags, candidates: candidates.slice(0, 3), descCandidates: descCandidates.slice(0, 3), ratio: heur.ratio, source, aiFailed };
}

        </section>
        <section class="panel glass" style="border-radius:18px;padding:24px">

  const fileInput = $('#fileInput');

  fileInput.addEventListener('change', e => handleFiles(e.target.files));

  ['dragleave', 'drop'].forEach(ev => dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.remove('over'); }));
  dropzone.addEventListener('drop', e => { if (e.dataTransfer.files?.length) handleFiles(e.dataTransfer.files); });

  $('#newAlbumMiniBtn').addEventListener('click', () => {
    const { close, root } = makeModal(`

  async function handleFiles(files) {
    const list = Array.from(files).filter(f => f.type.startsWith('image/') || f.type.startsWith('video/'));
    if (!list.length) return toast('没有可用的文件');
    const useLocal = $('#useLocalAI').checked;
    const newItems = [], dupDb = [], dupPending = [];
    for (const f of list) {
      const fp = `${f.name}_${f.size}_${f.lastModified}`;
      if (pendingUploads.some(u => u.fingerprint === fp)) { dupPending.push(f); continue; }
      if (state.photos.some(p => p.fingerprint === fp)) { dupDb.push({ file: f, fp }); continue; }
      newItems.push({ file: f, fp });
    }
    let allowDb = false;
    if (dupDb.length) {
      allowDb = await new Promise(resolve => {
        const { close, root } = makeModal(`
          <h3>发现重复照片</h3>
          <p style="color:var(--muted);font-size:13px;line-height:1.8;margin:0 0 10px">以下 ${dupDb.length} 张照片已在图库中：</p>
          <ul style="margin:0 0 12px;padding-left:18px;color:var(--muted);font-size:12px;max-height:180px;overflow:auto">${dupDb.map(d => `<li>${esc(d.file.name)}</li>`).join('')}</ul>
          <div class="modal-actions"><button class="btn-ghost" data-act="skip">只上传新照片</button><button class="btn-primary" data-act="all">全部上传</button></div>`);
        if (!root) { resolve(false); return; }
        root.addEventListener('click', e => {
          const act = e.target.closest('[data-act]')?.dataset.act;
          if (act === 'skip') { close(); resolve(false); }
          if (act === 'all') { close(); resolve(true); }
        });
      });
    }
    if (dupPending.length) toast(`跳过 ${dupPending.length} 张已在待上传列表中的相同照片`);
    const finalList = [...newItems, ...(allowDb ? dupDb.map(d => ({ file: d.file, fp: d.fp })) : [])];
    if (!finalList.length) return toast('没有新的照片需要处理');
    showUploadProgress(`正在处理 ${finalList.length} 个文件…`);
    let ok = 0, fail = 0, done = 0;
    for (const { file: f, fp } of finalList) {
      try {
        if (f.type.startsWith('video/')) {
          const check = await checkVideo(f);
          if (!check.ok) { toast(check.msg); fail++; done++; setUploadProgress(done/finalList.length*100); continue; }
          const cover = await extractVideoCover(f);
          pendingUploads.push({
            kind: 'live', videoBlob: f, coverBlob: cover,
            previewUrl: URL.createObjectURL(cover || new Blob()),
            name: f.name.replace(/\.[^.]+$/, ''), ratio: 1, analysisReady: true,
            sceneCandidates: [], descCandidates: [], colorTags: [],
            chosenScene: null, chosenDescs: [], source: 'basic', exif: null, aiFailed: false,
            fingerprint: fp, saved: false,
            custom: { title: '', date: '', place: '', albumId: '', tags: '', kind: '', note: '' }
          });
          ok++;
        } else {
          const [{ blob, w, h }, exifData] = await Promise.all([compressImage(f), readExifSafe(f)]);
          const item = {
            kind: 'photo', blob, w, h, name: f.name.replace(/\.[^.]+$/, ''),
            previewUrl: URL.createObjectURL(blob), ratio: h / w,
            analysisReady: false, sceneCandidates: [], descCandidates: [], colorTags: [],
            chosenScene: null, chosenDescs: [], source: 'basic', exif: exifData, aiFailed: false,
            fingerprint: fp, saved: false,
            custom: { title: '', date: '', place: '', albumId: '', tags: '', kind: '', note: '' }
          };
          pendingUploads.push(item); ok++;
          analyzeImage(blob, { useLocal }).then(a => {
            item.analysisReady = true;
            item.sceneCandidates = a.candidates;
            item.descCandidates = a.descCandidates;
            item.colorTags = a.colorTags;
            item.source = a.source;
            item.aiFailed = a.aiFailed;
            renderPreview();
          });
        }
      } catch (err) { console.warn(err); fail++; }
      done++; setUploadProgress(done / finalList.length * 100);
    }
    renderPreview(); hideUploadProgress();
    if (fail > 0) toast(`成功 ${ok}，失败 ${fail}`);
    else toast(`已就绪 ${ok} 个文件`);
    fileInput.value = '';
  }

  function buildCustomSummary(custom) {
    const parts = [];
    if (custom.title) parts.push(`标题: ${esc(custom.title)}`);
    if (custom.date) parts.push(`日期: ${esc(custom.date)}`);
    if (custom.place) parts.push(`地点: ${esc(custom.place)}`);
    if (custom.albumId) { const album = state.albums.find(a => a.id === custom.albumId); if (album) parts.push(`相册: ${esc(album.name)}`); }
    if (custom.tags) parts.push(`标签: ${esc(custom.tags)}`);
    if (custom.kind) { const kindLabel = custom.kind === 'polaroid' ? '拍立得' : custom.kind === 'film' ? '胶卷' : '普通照片'; parts.push(`类型: ${kindLabel}`); }
    if (custom.note) parts.push(`故事: ${esc(custom.note.slice(0, 20))}${custom.note.length > 20 ? '…' : ''}`);
    return parts.join(' · ');
  }

  function renderPreview() {
    const box = $('#previewList'); if (!box) return;
    box.innerHTML = pendingUploads.map((u, i) => {
      const sceneChips = u.sceneCandidates.map(c => {
        const name = sceneName(c.scene) || c.scene;
        const chosen = u.chosenScene === c.scene;
        return `<span class="pi-chip ${chosen?'chosen':''} ${c.hint?'low':''}" data-pick-scene="${c.scene}" data-idx="${i}">${esc(name)} ${Math.round(c.conf*100)}%${c.hint?' · '+c.hint:''}</span>`;
      }).join('');
      const descChips = u.descCandidates.map(d => {
        const chosen = u.chosenDescs.includes(d);
        return `<span class="pi-chip ${chosen?'chosen':''}" data-pick-desc="${esc(d)}" data-idx="${i}">${esc(d)}</span>`;
      }).join('');
      const status = !u.analysisReady ? '识别中…' : (u.sceneCandidates.length ? '' : '识别不可用，可手动选择场景');
      const sourceLabel = u.source === 'local' ? '本地' : '';
      const hasCustom = u.custom && Object.values(u.custom).some(v => v && (Array.isArray(v) ? v.length : String(v).trim()));
      const customSummary = hasCustom ? buildCustomSummary(u.custom) : '';
      return `<div class="preview-item ${hasCustom ? 'has-custom' : ''} ${u.saved ? 'is-saved' : ''}" data-detail="${i}">
        <div class="pi-media"><img src="${u.previewUrl}" alt=""></div>
        <button class="pi-rm" data-rm="${i}">✕</button>
        ${sceneChips || descChips ? `<div class="pi-chips" data-no-detail="1">${sourceLabel ? `<span style="font-size:9px;color:var(--muted);align-self:center;">[${sourceLabel}]</span>` : ''}${sceneChips}${descChips}</div>` : ''}
        ${status ? `<div class="pi-status">${status}</div>` : ''}
        ${u.saved ? '<div class="pi-status saved">✓ 已保存</div>' : ''}
        ${customSummary ? `<div class="pi-custom-summary">${customSummary}</div>` : ''}
      </div>`;
    }).join('');
    box.onclick = e => {
      const rm = e.target.closest('[data-rm]');
      if (rm) {
        e.stopPropagation();
        const i = Number(rm.dataset.rm);
        if (pendingUploads[i]?.saved) { toast('已保存的照片请到管理列表删除'); return; }
        URL.revokeObjectURL(pendingUploads[i].previewUrl);
        pendingUploads.splice(i, 1); renderPreview(); return;
      }
      const pickScene = e.target.closest('[data-pick-scene]');
      if (pickScene) {
        e.stopPropagation();
        const i = Number(pickScene.dataset.idx);
        const sc = pickScene.dataset.pickScene;
        const u = pendingUploads[i];
        u.chosenScene = u.chosenScene === sc ? null : sc;
        u.aiFailed = false;
        renderPreview(); return;
      }
      const pickDesc = e.target.closest('[data-pick-desc]');
      if (pickDesc) {
        e.stopPropagation();
        const i = Number(pickDesc.dataset.idx);
        const d = pickDesc.dataset.pickDesc;
        const u = pendingUploads[i];
        if (u.chosenDescs.includes(d)) u.chosenDescs = u.chosenDescs.filter(x => x !== d);
        else if (u.chosenDescs.length < 3) u.chosenDescs.push(d);
        u.aiFailed = false;
        renderPreview(); return;
      }
      const card = e.target.closest('[data-detail]');
      if (!card) return;
      if (card.classList.contains('is-saved')) return;
      const i = Number(card.dataset.detail);
      if (isNaN(i) || !pendingUploads[i]) return;
      openPerPhotoEditDialog(i);
    };
  }
  renderPreview();

  function openPerPhotoEditDialog(index) {
    const u = pendingUploads[index]; if (!u) return;
    if (!u.custom) u.custom = { title: '', date: '', place: '', albumId: '', tags: '', kind: '', note: '' };
    const isVideo = u.kind === 'live';
    const albumOptions = nonEmptyAlbums(u.custom.albumId).map(a => `<option value="${esc(a.id)}" ${a.id === u.custom.albumId ? 'selected' : ''}>${esc(a.name)}</option>`).join('');
    const kindOptions = [{ v:'photo', n:'普通照片' }, { v:'polaroid', n:'拍立得' }, { v:'film', n:'胶卷' }].map(k => `<option value="${k.v}" ${k.v === u.custom.kind ? 'selected' : ''}>${k.n}</option>`).join('');
    const { close, root } = makeModal(`
      <h3>编辑这张照片的信息</h3>
      <p style="color:var(--muted);font-size:12px;line-height:1.7;margin:0 0 16px">留空的字段会使用左侧"全局设置"的值。</p>
      <div class="field"><label>标题</label><input class="input" id="ppTitle" value="${esc(u.custom.title)}" placeholder="${esc(u.name)}"></div>
      <div class="field"><label>日期</label><input class="input" type="date" id="ppDate" value="${esc(u.custom.date)}"></div>
      <div class="field"><label>地点</label><input class="input" id="ppPlace" value="${esc(u.custom.place)}"></div>
      <div class="field"><label>相册</label><select class="input" id="ppAlbum"><option value="">— 使用全局 —</option>${albumOptions}</select></div>
      <div class="field"><label>标签（逗号分隔，会与全局标签合并）</label><input class="input" id="ppTags" value="${esc(u.custom.tags)}"></div>
      ${isVideo ? '<div class="field"><label>类型</label><input class="input" value="视频" disabled></div>' : `<div class="field"><label>类型</label><select class="input" id="ppKind"><option value="">— 使用全局 —</option>${kindOptions}</select></div>`}
      <div class="field"><label>故事 / 备注</label><textarea class="input" id="ppNote" placeholder="留空则使用全局故事">${esc(u.custom.note)}</textarea></div>
      <div class="modal-actions">

      </div>`);
    if (!root) return;
    root.addEventListener('click', e => {

      if (act === 'reset') {
        u.custom = { title: '', date: '', place: '', albumId: '', tags: '', kind: '', note: '' };
        close(); renderPreview(); toast('已清空这张照片的单独设置'); return;
      }
      if (act === 'cancel') { close(); return; }
      if (act === 'save') {
        u.custom.title = $('#ppTitle', root).value.trim();

        u.custom.place = $('#ppPlace', root).value.trim();
        u.custom.albumId = $('#ppAlbum', root).value;
        u.custom.tags = $('#ppTags', root).value.trim();
        if (!isVideo) u.custom.kind = $('#ppKind', root).value;
        u.custom.note = $('#ppNote', root).value.trim();
        close(); renderPreview(); toast('已保存这张照片的详情');
      }
    });
  }

  $('#clearUploadsBtn').addEventListener('click', () => {
    if (!pendingUploads.length) return;
    pendingUploads.forEach(u => URL.revokeObjectURL(u.previewUrl));
    pendingUploads = []; renderPreview(); toast('已清空待上传列表');
  });

  const doSaveData = async (title, date, place, albumId, manualTags, kindSelect, note, btn) => {
    btn.disabled = true; btn.textContent = '保存中…';
    const toSave = pendingUploads.filter(u => !u.saved);
    if (!toSave.length) { btn.disabled = false; btn.textContent = '保存到暗房'; isSaving = false; return toast('没有新照片需要保存'); }
    const conflictResolutions = {};
    try {
      for (const u of toSave) {
        const k = u.kind === 'live' ? 'live' : kindSelect;
        if ((k === 'polaroid' || k === 'film') && !conflictResolutions[k]) conflictResolutions[k] = await resolveAutoAlbumConflict(k);
      }
    } catch (err) { console.warn('相册冲突检测失败', err); }

    let saved = 0; let saveError = null;
    try {
      for (const u of toSave) {
        const id = uid();
        const c = u.custom || {};
        const finalTitle = c.title || title || u.name || '未命名';
        const finalDate = c.date || date;
        const finalPlace = c.place || place;
        const customTags = c.tags ? c.tags.split(/[,，]/).map(s => s.trim()).filter(Boolean) : [];
        const finalNote = c.note || note;
        let tags = [...manualTags, ...customTags];
        let scene = null;
        if (u.kind === 'photo') {
          scene = u.chosenScene || null;
          if (u.chosenDescs && u.chosenDescs.length) u.chosenDescs.forEach(d => { if (!tags.includes(d)) tags.push(d); });
          if (u.colorTags) u.colorTags.forEach(t => { if (!tags.includes(t)) tags.push(t); });
        }
        if (scene) {
          tags = tags.filter(t => !isSceneName(t));
          const sn = sceneName(scene);
          if (sn && !tags.includes(sn)) tags.push(sn);
        }
        tags = [...new Set(tags)];
        const globalKind = kindSelect;
        const kindFromCustom = (!c.kind || c.kind === '' || c.kind === 'live') ? null : c.kind;
        const effectiveKind = u.kind === 'live' ? 'live' : (kindFromCustom || globalKind);
        let finalAlbumId = c.albumId || albumId || null;
        let extraAlbumIds = [];
        if (effectiveKind === 'polaroid' || effectiveKind === 'film') {
          const res = conflictResolutions[effectiveKind];
          if (res) {
            if (finalAlbumId && finalAlbumId !== res.targetId) extraAlbumIds = [finalAlbumId];
            finalAlbumId = res.targetId;
          }
        }
        const photo = {
          id, title: finalTitle, date: finalDate, place: finalPlace,
          albumId: finalAlbumId, extraAlbumIds, kind: effectiveKind, tags, note: finalNote, favorite: false,
          createdAt: Date.now(), updatedAt: Date.now(), ratio: u.ratio || 1.3, privacy: 'public', sortWeight: Date.now(),
          scene, deletedAt: null, restoredAt: null, originalBlob: null,
          blob: u.kind === 'photo' ? u.blob : null,
          videoBlob: u.kind === 'live' ? u.videoBlob : null,
          coverBlob: u.kind === 'live' ? u.coverBlob : null,
          exif: u.kind === 'photo' ? (u.exif || null) : null,
          fingerprint: u.fingerprint || null, featuredIn: []
        };
        await idbPut('photos', photo); state.photos.push(photo);
        u.saved = true; saved++;
      }
      $('#upTitle').value = ''; $('#upTags').value = ''; $('#upNote').value = '';
      toast(note ? `已保存 ${saved} 个文件（故事已附带）` : `已保存 ${saved} 个文件`);
    } catch (err) { saveError = err; console.error(err); }
    finally {
      renderPreview(); renderManage();
      isSaving = false; btn.disabled = false; btn.textContent = '保存到暗房';
    }
    if (saveError) {
      if (saved > 0) toast(`已保存 ${saved} 张，后续 ${toSave.length - saved} 张失败（可能存储已满）`);
      else toast('保存失败：' + (saveError.message || '未知错误'));
    }
  };

  $('#saveBtn').addEventListener('click', async () => {

    const title = $('#upTitle').value.trim();

      if (!root) { isSaving = false; return; }
      root.addEventListener('click', async e => {
        const act = e.target.closest('[data-act]')?.dataset.act;

        if (act === 'ok') { close(); await doSaveData(title, date, place, albumId, manualTags, kindSelect, note, btn); }
      });
    } else await doSaveData(title, date, place, albumId, manualTags, kindSelect, note, btn);
  });

  function renderManage() {

    if (!searchEl || !sortEl || !box) return;
    const q = searchEl.value.trim().toLowerCase();
    const sortMode = sortEl.value;
    let list = sortPhotos(state.photos.filter(p => !p.deletedAt && (p.createdAt || 0) > manageClearedAt), sortMode);
    if (q) list = list.filter(p => [p.title, p.place, p.note, (p.tags || []).join(' ')].join(' ').toLowerCase().includes(q));

    box.innerHTML = list.map(p => `
      <div class="manage-row" data-id="${esc(p.id)}">

        </div>

async function checkVideo(file) {
  if (file.size > 50 * 1024 * 1024) return { ok: false, msg: '视频超过 50MB，请先压缩后再上传' };
  return new Promise(resolve => {
    const v = document.createElement('video'); v.preload = 'metadata';
    v.onloadedmetadata = () => { URL.revokeObjectURL(v.src); if (v.duration > 60) resolve({ ok: false, msg: '视频超过 60 秒，请选择更短的片段' }); else resolve({ ok: true }); };
    v.onerror = () => { URL.revokeObjectURL(v.src); resolve({ ok: false, msg: '视频读取失败' }); };
    v.src = URL.createObjectURL(file);
  });
}
async function extractVideoCover(file) {
  return new Promise(resolve => {
    const v = document.createElement('video'); v.preload = 'auto'; v.muted = true;
    v.onloadeddata = () => {
      const canvas = document.createElement('canvas');
      canvas.width = v.videoWidth || 640; canvas.height = v.videoHeight || 360;
      canvas.getContext('2d').drawImage(v, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(v.src);
      canvas.toBlob(b => resolve(b), 'image/jpeg', 0.85);
    };
    v.onerror = () => { URL.revokeObjectURL(v.src); resolve(null); };
    v.src = URL.createObjectURL(file);
  });
}
async function compressImage(file, maxSide = 1920) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        URL.revokeObjectURL(url);
        let w = img.naturalWidth || img.width; let h = img.naturalHeight || img.height;
        if (!w || !h) return reject(new Error('图片尺寸无效'));
        const scale = Math.min(1, maxSide / Math.max(w, h));
        w = Math.round(w * scale); h = Math.round(h * scale);
        const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob(blob => { blob ? resolve({ blob, w, h }) : reject(new Error('压缩失败')); }, 'image/jpeg', 0.86);
      } catch (err) { reject(err); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('图片加载失败')); };
    img.src = url;
  });
}
