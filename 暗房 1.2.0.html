<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>暗房画廊 · Darkroom Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Noto+Serif+SC:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --black:#0E0E0F;--deep:#171718;--cream:#E8E2D6;--muted:#9B968C;--orange:#C46A3B;--red:#7A2E2A;
  --glass-border: rgba(255,255,255,.14);
  --glass-shadow: 0 10px 40px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.12);
  --fluid-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --fluid-damp: cubic-bezier(0.2, 0.8, 0.2, 1);
  --ease: var(--fluid-damp);
  --serif:"Cormorant Garamond","Noto Serif SC","Songti SC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --hand:"LXGW WenKai","Kaiti SC","STKaiti",cursive;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--black);color:var(--cream);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;}
img{display:block;max-width:100%;}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;}
input,textarea,select{font-family:inherit;}
a{color:inherit;text-decoration:none;}
::selection{background:rgba(196,106,59,.4);}

/* 全局隐藏滚动条（保留滚动能力） */
*{scrollbar-width:none;-ms-overflow-style:none;}
*::-webkit-scrollbar{display:none;width:0;height:0;}
html,body{scrollbar-width:none;-ms-overflow-style:none;}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0;}

body::before{content:"";position:fixed;inset:-20%;z-index:0;pointer-events:none;background:radial-gradient(circle at 18% 14%,rgba(196,106,59,.20),transparent 42%),radial-gradient(circle at 86% 78%,rgba(122,46,42,.22),transparent 48%),radial-gradient(circle at 62% 42%,rgba(196,106,59,.06),transparent 60%);filter:blur(70px);animation:leak 30s ease-in-out infinite alternate;}
@keyframes leak{0%{transform:translate3d(0,0,0) scale(1);}50%{transform:translate3d(-4%,3%,0) scale(1.08);}100%{transform:translate3d(3%,-4%,0) scale(1.03);}}
body::after{content:"";position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.05;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='220' height='220' filter='url(%23n)' opacity='0.75'/></svg>");background-size:220px 220px;}

.glass-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:999px;font-size:13px;letter-spacing:.06em;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.12);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:background .35s var(--ease),transform .35s var(--fluid-spring);cursor:pointer;}
.glass-btn:hover{background:rgba(255,255,255,.17);transform:translateY(-1px);}
.glass-btn:active{transform:scale(0.95) !important;transition:transform 0.1s var(--fluid-damp);}

.nav{position:fixed;top:16px;left:50%;transform:translateX(-50%);width:min(1280px,calc(100% - 32px));height:60px;z-index:60;display:flex;align-items:center;gap:20px;padding:0 20px;border-radius:18px;
  background: linear-gradient(135deg, rgba(22,22,24,.62) 0%, rgba(22,22,24,.42) 100%);
  border: 1px solid var(--glass-border);
  box-shadow: 0 8px 30px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.12);
  backdrop-filter: blur(32px) saturate(180%);
  -webkit-backdrop-filter: blur(32px) saturate(180%);
  transition:height .45s var(--ease),background .45s var(--ease),padding .45s var(--ease);}
.nav.scrolled{height:48px;background:rgba(18,18,20,.74);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);}
.brand{font-family:var(--serif);font-size:17px;letter-spacing:.22em;font-weight:600;white-space:nowrap;flex:0 0 auto;cursor:pointer;}
.brand span{color:var(--orange);font-weight:400;letter-spacing:.1em;}
.nav-links{display:flex;gap:20px;margin:0 auto;}
.nav-links a{position:relative;font-size:13px;color:var(--muted);letter-spacing:.1em;padding:6px 0;transition:color .35s var(--ease);}
.nav-links a:hover{color:var(--cream);}
.nav-links a.active{color:var(--cream);}
.nav-links a.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--orange);}
.nav-right{display:flex;align-items:center;gap:4px;flex:0 0 auto;}
.text-btn{height:32px;padding:0 12px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-size:12.5px;letter-spacing:.08em;color:var(--muted);transition:all .3s var(--ease);white-space:nowrap;}
.text-btn:hover{color:var(--cream);background:rgba(255,255,255,.1);}
.text-btn:active{transform:scale(0.95);transition:transform 0.1s var(--fluid-damp);}
.menu-toggle{display:none;}
.mobile-only{display:none;}

.search-pop{position:fixed;top:88px;left:50%;transform:translateX(-50%) translateY(-8px);width:min(560px,calc(100% - 32px));padding:14px 18px;border-radius:16px;z-index:59;opacity:0;pointer-events:none;transition:opacity .35s var(--ease),transform .35s var(--fluid-spring);
  background: linear-gradient(135deg, rgba(22,22,24,.62) 0%, rgba(22,22,24,.42) 100%);
  border: 1px solid var(--glass-border);
  box-shadow: 0 8px 30px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.12);
  backdrop-filter: blur(32px) saturate(180%);
  -webkit-backdrop-filter: blur(32px) saturate(180%);}
.search-pop.open{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0);}
.search-pop input{width:100%;background:none;border:none;outline:none;color:var(--cream);font-size:15px;letter-spacing:.04em;}
.search-pop input::placeholder{color:var(--muted);}

#app{position:relative;z-index:2;padding-top:104px;min-height:100vh;}
.boot-loading{min-height:calc(100vh - 104px);display:flex;align-items:center;justify-content:center;}
.boot-hint{font-family:var(--mono);font-size:11px;letter-spacing:.34em;color:rgba(155,150,140,.6);text-transform:uppercase;}
.boot-dot{display:inline-block;animation:bootDot 1.4s ease-in-out infinite;}
.boot-dot:nth-child(2){animation-delay:.2s;}
.boot-dot:nth-child(3){animation-delay:.4s;}
@keyframes bootDot{0%,100%{opacity:.25;}50%{opacity:1;}}

.back-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;font-size:14px;letter-spacing:.08em;color:var(--cream);
  background: linear-gradient(135deg, rgba(22,22,24,.62) 0%, rgba(22,22,24,.42) 100%);
  border: 1px solid var(--glass-border);
  box-shadow: 0 8px 24px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.12);
  backdrop-filter: blur(28px) saturate(180%);
  -webkit-backdrop-filter: blur(28px) saturate(180%);
  transition: background .3s var(--ease), transform .3s var(--fluid-spring);cursor:pointer;}
.back-btn:hover{background: linear-gradient(135deg, rgba(48,48,50,.72) 0%, rgba(48,48,50,.52) 100%);transform: translateY(-1px);}
.back-btn:active{transform:scale(0.95);transition:transform 0.1s var(--fluid-damp);}
.back-arrow{font-size:16px;line-height:1;margin-right:-2px;}

.page{max-width:1280px;margin:0 auto;padding:0 24px 130px;}
.page-head{margin:36px 0 30px;}
.page-head h1{font-family:var(--serif);font-weight:300;font-size:clamp(30px,5vw,52px);letter-spacing:.03em;margin:0 0 8px;line-height:1.15;}
.page-desc{color:var(--muted);font-size:14px;letter-spacing:.08em;margin:0;}
.head-actions{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:28px;align-items:center;}

.hero{position:relative;min-height:64vh;display:flex;flex-direction:column;justify-content:center;padding:40px 0 60px;}
.hero h1{font-family:var(--serif);font-weight:300;font-size:clamp(42px,9vw,110px);line-height:1.02;letter-spacing:.03em;margin:0 0 18px;background:linear-gradient(180deg,#F4EFE6 0%,#BFB8AA 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}
.hero-sub{color:var(--muted);font-size:15px;letter-spacing:.24em;margin:0;}
.scroll-hint{margin-top:56px;font-family:var(--mono);font-size:10px;letter-spacing:.34em;color:rgba(155,150,140,.6);animation:breathe 4s ease-in-out infinite;}
@keyframes breathe{0%,100%{opacity:.35;}50%{opacity:.85;}}
.today-film{position:absolute;right:0;bottom:40px;width:150px;border-radius:12px;padding:10px;transform:rotate(2.4deg);transition:transform .5s var(--fluid-spring);cursor:pointer;
  background: linear-gradient(135deg, rgba(22,22,24,.62) 0%, rgba(22,22,24,.42) 100%);
  border: 1px solid var(--glass-border);
  box-shadow: 0 8px 30px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.12);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);}
.today-film:hover{transform:rotate(0deg) translateY(-4px);}
.today-film img{width:100%;height:96px;object-fit:cover;border-radius:6px;filter:saturate(.85);}
.tf-label{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.22em;color:var(--orange);margin-bottom:7px;}
.tf-title{display:block;font-size:11px;color:var(--muted);margin-top:7px;letter-spacing:.06em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.filter-bar{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 26px;align-items:center;}
.chip{padding:8px 18px;border-radius:999px;font-size:12.5px;letter-spacing:.1em;color:var(--muted);border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);transition:all .35s var(--fluid-spring);white-space:nowrap;}
.chip:hover{color:var(--cream);border-color:rgba(255,255,255,.25);}
.chip.active{color:#1a1a1a;background:var(--cream);border-color:var(--cream);}
.chip:active{transform:scale(0.95);transition:transform 0.1s var(--fluid-damp);}
.filter-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}

.masonry{position:relative;width:100%;}
.photo-card{position:absolute;top:0;left:0;border-radius:4px;overflow:hidden;background:#101011;cursor:pointer;animation:develop .78s var(--ease) backwards;animation-delay:calc(var(--i,0) * 55ms);transition:box-shadow .45s var(--ease);will-change:transform,opacity;
  -webkit-touch-callout: none;-webkit-user-select: none;user-select: none;}
@keyframes develop{from{opacity:0;transform:translateY(20px);filter:blur(9px);}to{opacity:1;transform:none;filter:blur(0);}}
.photo-card:hover{box-shadow:0 18px 50px rgba(0,0,0,.6);}
.card-media{position:absolute;inset:0;overflow:hidden;background:#151516;}
.card-media img{width:100%;height:100%;object-fit:cover;filter:saturate(.88) brightness(.94);transition:transform .7s var(--ease),filter .6s var(--ease);-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;}
.photo-card:hover .card-media img{transform:scale(1.035);filter:saturate(1) brightness(1);}
.card-media::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,.45) 100%);}
.photo-card.is-polaroid{background:#F2EDE3;padding:8px 8px 0;border-radius:3px;}
.photo-card.is-polaroid .card-media{position:relative;inset:auto;height:calc(100% - 34px);}
.photo-card.is-polaroid .card-media::after{display:none;}
.polaroid-caption{position:absolute;left:8px;right:8px;bottom:6px;height:28px;display:flex;align-items:center;justify-content:center;font-family:var(--hand);font-size:13px;color:#4a443c;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.photo-card.is-film{background:#141415;padding:10px 10px 26px;border-radius:3px;}
.photo-card.is-film .card-media{position:relative;inset:auto;height:calc(100% - 14px);border-radius:2px;}
.photo-card.is-film .card-media::after{display:none;}
.photo-card.is-film .card-media img{filter:saturate(.92) brightness(.92);}
.film-holes-top,.film-holes-bottom{position:absolute;left:10px;right:10px;height:14px;pointer-events:none;z-index:2;background-image:radial-gradient(circle,rgba(232,226,214,.35) 0 3px,transparent 3.4px);background-size:18px 14px;background-position:9px center;transition:opacity .4s var(--ease);}
.film-holes-top{top:4px;}
.film-holes-bottom{bottom:4px;}
.photo-card.is-film:hover .film-holes-top,.photo-card.is-film:hover .film-holes-bottom{opacity:.85;}
.film-number{position:absolute;left:12px;bottom:8px;font-family:var(--mono);font-size:9px;color:rgba(255,255,255,.55);letter-spacing:.14em;z-index:2;}
.card-fav{position:absolute;top:10px;left:10px;font-size:13px;color:var(--orange);text-shadow:0 2px 8px rgba(0,0,0,.6);pointer-events:none;z-index:3;}
.card-video-badge{position:absolute;top:10px;right:10px;z-index:3;background:rgba(0,0,0,.55);color:#fff;font-size:10px;padding:3px 8px;border-radius:999px;letter-spacing:.08em;backdrop-filter:blur(6px);}
.card-tools{position:absolute;bottom:8px;right:8px;display:flex;gap:6px;z-index:4;opacity:0;transform:translateY(4px);transition:all .35s var(--fluid-spring);}
.photo-card:hover .card-tools{opacity:1;transform:none;}
.ct-btn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:rgba(0,0,0,.52);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--cream);transition:all .3s var(--ease);}
.ct-btn:hover{background:rgba(70,70,72,.72);}
.ct-btn:active{transform:scale(0.9);}
.photo-card.is-polaroid .ct-btn{background:rgba(0,0,0,.08);border-color:rgba(0,0,0,.1);color:#4a443c;}
.photo-card.is-polaroid .ct-btn:hover{background:rgba(0,0,0,.18);}
.select-dot{position:absolute;top:10px;left:10px;width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(255,255,255,.6);background:rgba(0,0,0,.3);backdrop-filter:blur(10px);display:none;z-index:5;align-items:center;justify-content:center;font-size:12px;color:#111;}
body.select-mode .select-dot{display:flex;}
body.select-mode .card-tools,body.select-mode .card-fav,body.select-mode .card-video-badge,body.select-mode .film-holes-top,body.select-mode .film-holes-bottom,body.select-mode .film-number{display:none;}
.photo-card.selected .select-dot{background:var(--orange);border-color:var(--orange);}
.photo-card.selected .select-dot::after{content:"✓";color:#fff;font-size:12px;}
.photo-card.selected{outline:2px solid var(--orange);outline-offset:-2px;}

.section-block{margin:80px 0 0;}
.sec-title{font-family:var(--serif);font-weight:300;font-size:26px;letter-spacing:.06em;margin:0 0 22px;display:flex;align-items:center;gap:14px;}
.sec-title .sec-line{flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.16),transparent);}
.sec-title .glass-btn{flex:0 0 auto;font-size:11px;padding:5px 14px;}

.filmstrip{position:relative;padding:0;overflow:hidden;border-radius:8px;background:#141415;}
.film-track{display:flex;gap:10px;overflow-x:auto;padding:24px 12px;scrollbar-width:none;cursor:grab;scroll-behavior:smooth;touch-action:pan-x;-webkit-overflow-scrolling:touch;}
.film-track::-webkit-scrollbar{display:none;}
.film-track.dragging{cursor:grabbing;scroll-behavior:auto;}
.filmstrip::before,.filmstrip::after{content:"";position:absolute;left:0;right:0;height:16px;z-index:2;pointer-events:none;background-image:radial-gradient(circle,rgba(232,226,214,.3) 0 2.5px,transparent 3.2px);background-size:17px 16px;background-position:6px center;}
.filmstrip::before{top:4px;}.filmstrip::after{bottom:4px;}
.frame{flex:0 0 auto;width:150px;height:100px;border-radius:2px;overflow:hidden;position:relative;background:#222;transition:transform .45s var(--ease),opacity .45s var(--ease),filter .45s var(--ease);cursor:pointer;
  -webkit-touch-callout: none;-webkit-user-select: none;user-select: none;}
.frame img{width:100%;height:100%;object-fit:cover;filter:saturate(.82) brightness(.86);transition:filter .45s var(--ease);-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;}
.frame-no{position:absolute;left:6px;bottom:5px;font-family:var(--mono);font-size:9px;color:rgba(255,255,255,.75);letter-spacing:.14em;text-shadow:0 1px 4px rgba(0,0,0,.9);}
.film-track:hover .frame{opacity:.45;filter:brightness(.55);}
.film-track:hover .frame:hover{opacity:1;filter:none;transform:scale(1.07);}
.film-track:hover .frame:hover img{filter:saturate(1) brightness(1);}
.frame.selected{outline:3px solid var(--orange);outline-offset:-3px;box-shadow:inset 0 0 0 100px rgba(196,106,59,.2);}
body.select-mode .film-track:hover .frame{opacity:1;filter:none;}
body.select-mode .film-track:hover .frame:hover{transform:scale(1.03);}
.film-arrow{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--cream);font-size:20px;line-height:1;z-index:5;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .35s var(--ease),background .25s;user-select:none;}
.filmstrip:hover .film-arrow{opacity:1;}
.film-arrow:hover{background:rgba(255,255,255,.28);}
.film-arrow:active{transform:translateY(-50%) scale(.92);}
.film-arrow:disabled{opacity:.25;pointer-events:none;}
.film-arrow-left{left:8px;}
.film-arrow-right{right:8px;}
@media (max-width:860px){.film-arrow{display:none;}}

.polaroid-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:26px 20px;padding:10px 0;}
.polaroid-card{background:#F2EDE3;padding:10px 10px 0;border-radius:3px;cursor:pointer;box-shadow:0 14px 34px rgba(0,0,0,.5);transform:rotate(var(--rot,0deg));transition:transform .5s var(--fluid-spring),box-shadow .5s var(--ease);animation:develop .8s var(--ease) backwards;animation-delay:calc(min(var(--i,0), 10) * 70ms);
  -webkit-touch-callout: none;-webkit-user-select: none;user-select: none;}
.polaroid-card:hover{transform:rotate(0deg) translateY(-6px) scale(1.02);box-shadow:0 24px 54px rgba(0,0,0,.62);}
.pc-media{aspect-ratio:1/1;overflow:hidden;background:#ddd;position:relative;}
.pc-media img{width:100%;height:100%;object-fit:cover;filter:saturate(.9) sepia(.05);-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;}
.pc-media img.img-error{background:linear-gradient(135deg,#2a2a2c 0%,#1a1a1c 100%);}
.pc-media:has(img.img-error)::after{content:"暂无预览";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;letter-spacing:.1em;pointer-events:none;}
.pc-title{font-family:var(--hand);font-size:14px;color:#4a443c;text-align:center;padding:12px 4px 4px;min-height:34px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pc-date{font-family:var(--mono);font-size:9px;color:#9a9184;text-align:center;letter-spacing:.12em;padding-bottom:10px;}

.album-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px;}
.album-card{position:relative;border-radius:16px;overflow:hidden;cursor:pointer;background:#131314;border:1px solid rgba(255,255,255,.07);transition:transform .5s var(--fluid-spring),box-shadow .5s var(--ease);}
.album-card:hover{transform:translateY(-4px);box-shadow:0 22px 54px rgba(0,0,0,.6);}
.album-cover{aspect-ratio:16/10;overflow:hidden;position:relative;}
.album-cover img{width:100%;height:100%;object-fit:cover;filter:saturate(.85) brightness(.86);transition:transform .7s var(--ease),filter .6s var(--ease);}
.album-card:hover .album-cover img{transform:scale(1.05);filter:saturate(1) brightness(1);}
.album-cover.locked img{filter:blur(18px) brightness(.6) saturate(.4);}
.album-lock{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;color:rgba(255,255,255,.7);background:rgba(0,0,0,.35);}
.album-body{padding:16px 18px 20px;}
.album-name{font-family:var(--serif);font-size:20px;letter-spacing:.06em;margin:0 0 6px;}
.album-desc{color:var(--muted);font-size:12.5px;line-height:1.6;margin:0 0 10px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.album-meta{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:rgba(155,150,140,.75);}
.album-more{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:14px;z-index:3;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);opacity:0;transition:opacity .35s var(--ease);}
.album-card:hover .album-more{opacity:1;}
.album-select-dot{position:absolute;top:10px;left:10px;width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(255,255,255,.6);background:rgba(0,0,0,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:none;z-index:6;align-items:center;justify-content:center;font-size:12px;color:#fff;}
body.album-select-mode .album-select-dot{display:flex;}
body.album-select-mode .album-more{display:none;}
.album-card.album-selected .album-select-dot{background:var(--orange);border-color:var(--orange);}
.album-card.album-selected .album-select-dot::after{content:"✓";color:#fff;font-size:12px;}
.album-card.album-selected{outline:2px solid var(--orange);outline-offset:-2px;}

.empty{padding:80px 20px;text-align:center;color:var(--muted);font-size:14px;letter-spacing:.1em;line-height:2.2;}
.empty strong{display:block;font-family:var(--serif);font-size:24px;color:var(--cream);font-weight:300;margin-bottom:12px;}

.panel{border-radius:18px;padding:24px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:11px;letter-spacing:.18em;color:var(--muted);margin-bottom:7px;}
.input,textarea.input,select.input{width:100%;padding:11px 14px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);color:var(--cream);font-size:13.5px;outline:none;transition:border-color .3s var(--ease),background .3s var(--ease);}
.input:focus{border-color:rgba(196,106,59,.7);background:rgba(255,255,255,.1);}
textarea.input{resize:vertical;min-height:76px;line-height:1.6;}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;}
select.input option{background:#1a1a1b;color:var(--cream);}

.lightbox{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;background:rgba(8,8,9,.9);backdrop-filter:blur(30px) saturate(120%);-webkit-backdrop-filter:blur(30px) saturate(120%);opacity:0;pointer-events:none;transition:opacity .4s var(--ease);}
.lightbox.open{opacity:1;pointer-events:auto;}
.lb-holes{position:absolute;top:0;left:0;right:0;height:14px;opacity:.5;pointer-events:none;background-image:radial-gradient(circle,rgba(232,226,214,.4) 0 2px,transparent 2.8px);background-size:16px 14px;background-position:8px center;}
.lb-top{position:relative;z-index:5;display:flex;align-items:center;gap:12px;margin:14px 16px 0;padding:8px 12px;border-radius:16px;
  background: linear-gradient(135deg, rgba(22,22,24,.62) 0%, rgba(22,22,24,.42) 100%);
  border: 1px solid var(--glass-border);
  box-shadow: 0 8px 30px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.12);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  transform:translateY(-12px);opacity:0;transition:all .4s var(--fluid-spring);}
.lightbox.open .lb-top{transform:none;opacity:1;}
.lb-heading{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1;}
.lb-name{font-family:var(--serif);font-size:16px;letter-spacing:.06em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lb-counter{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--muted);flex:0 0 auto;}
.lb-tools{display:flex;align-items:center;gap:2px;flex:0 0 auto;}
.lb-btn{height:30px;padding:0 10px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;letter-spacing:.06em;color:rgba(232,226,214,.78);transition:all .28s var(--ease);white-space:nowrap;}
.lb-btn:hover{background:rgba(255,255,255,.14);color:var(--cream);}
.lb-btn:active{transform:scale(0.95) !important;transition:transform 0.1s var(--fluid-damp);}
.lb-btn.active{color:var(--orange);background:rgba(196,106,59,.16);}
.lb-btn.active[data-lb="motion"]{animation:lbMotionPulse 2.4s ease-in-out infinite;}
@keyframes lbMotionPulse{0%,100%{box-shadow:0 0 0 0 rgba(196,106,59,0);}50%{box-shadow:0 0 0 3px rgba(196,106,59,.18);}}
.lb-btn.on{color:var(--orange);}
.lb-btn:disabled{opacity:.3;cursor:not-allowed;}
.lb-btn.lb-danger{color:#D9705E;}
.lb-btn.lb-danger:hover{background:rgba(217,112,94,.2);color:#F09080;}
.lb-mobile-tools button.lb-danger{color:#D9705E;}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:15;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:24px;line-height:1;color:rgba(232,226,214,.8);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:all .3s var(--fluid-spring);}
.lb-nav:hover{background:rgba(255,255,255,.18);color:#fff;transform:translateY(-50%) scale(1.06);}
.lb-nav:active{transform:translateY(-50%) scale(.94) !important;}
.lb-prev{left:22px;}.lb-next{right:22px;}
.lb-stage{flex:1;display:flex;align-items:center;justify-content:center;padding:16px 90px;position:relative;min-height:0;overflow:hidden;}
.lb-frame{display:flex;align-items:center;justify-content:center;width:100%;height:100%;position:relative;overflow:hidden;}
@keyframes lb-develop{from{opacity:0;filter:blur(26px);transform:scale(1.05);}to{opacity:1;filter:blur(0);transform:scale(1);}}
.lb-frame.develop{animation:lb-develop .85s var(--ease);}
@keyframes lbBump{0%{transform:scale(1);}40%{transform:scale(1.015);}100%{transform:scale(1);}}
.lb-frame.bump{animation:lbBump .35s var(--fluid-spring);}
.lb-img,.lb-video{max-width:100%;max-height:calc(100vh - 250px);max-height:calc(100dvh - 250px);object-fit:contain;border-radius:4px;box-shadow:0 34px 90px rgba(0,0,0,.75);transition:transform var(--zoom-dur,0s) var(--ease),filter .5s var(--ease);transform-origin:center center;user-select:none;touch-action:none;will-change:transform,opacity;}
.lb-img.zoomed{cursor:grab;}
.lb-img.zoomed:active{cursor:grabbing;}
.lb-img.sim-warm,.lb-video.sim-warm{filter:sepia(.35) saturate(1.2) contrast(1.05) brightness(1.04) hue-rotate(-6deg);}
.lb-img.sim-bw,.lb-video.sim-bw{filter:grayscale(1) contrast(1.14) brightness(1.02);}
.lb-img.sim-fade,.lb-video.sim-fade{filter:saturate(.62) contrast(.88) brightness(1.08) sepia(.14);}

.lb-img.fx-kenburns{animation:fxKenburns 4s ease-in-out infinite;}
@keyframes fxKenburns{0%{transform:scale(1.2) translate(0,0);}50%{transform:scale(1.9) translate(-6%,-5%);}100%{transform:scale(1.2) translate(0,0);}}
.lb-img.fx-breathe{animation:fxBreathe 2s ease-in-out infinite;}
@keyframes fxBreathe{0%,100%{transform:scale(1.05);opacity:.3;}50%{transform:scale(1.25);opacity:1;}}
.lb-img.fx-leak{animation:fxLeak 3s ease-in-out infinite alternate;}
@keyframes fxLeak{
  0%{filter:brightness(1.15) saturate(1.4) hue-rotate(-8deg);box-shadow:inset 0 0 20vmin 5vmin rgba(255,140,70,.7),inset 0 0 40vmin 10vmin rgba(255,200,120,.4),0 0 80px 20px rgba(255,150,80,.5);}
  50%{filter:brightness(1.4) saturate(1.6) hue-rotate(-18deg);box-shadow:inset 0 0 40vmin 15vmin rgba(255,100,50,.95),inset 0 0 80vmin 25vmin rgba(255,180,100,.6),0 0 120px 30px rgba(255,120,60,.8);}
  100%{filter:brightness(1.15) saturate(1.4) hue-rotate(-3deg);box-shadow:inset 0 0 30vmin 8vmin rgba(200,60,40,.85),inset 0 0 60vmin 18vmin rgba(220,120,70,.55),0 0 100px 25px rgba(200,80,50,.6);}
}
.lb-img.fx-grain{animation:fxGrain .2s steps(2) infinite;}
@keyframes fxGrain{0%{transform:scale(1.08) translate(0,0);}25%{transform:scale(1.12) translate(-15px,15px);}50%{transform:scale(1.08) translate(15px,-15px);}75%{transform:scale(1.13) translate(-15px,-15px);}100%{transform:scale(1.08) translate(15px,15px);}}
.lb-img.fx-sway{animation:fxSway 2s ease-in-out infinite;}
@keyframes fxSway{0%,100%{transform:rotate(-10deg) scale(1.5);}50%{transform:rotate(10deg) scale(1.5);}}

.lb-particle-canvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:10;cursor:grab;touch-action:none;display:none;}
.lb-particle-canvas:active{cursor:grabbing;}

.lb-exif{position:absolute;top:80px;right:16px;bottom:130px;width:250px;z-index:6;border-radius:16px;padding:20px;
  background: linear-gradient(135deg, rgba(22,22,24,.88) 0%, rgba(22,22,24,.72) 100%);

.lb-exif.open{transform:none;opacity:1;pointer-events:auto;}
.lb-exif h4{font-family:var(--mono);font-size:10px;letter-spacing:.28em;color:var(--orange);margin:0 0 18px;font-weight:400;}
.exif-row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:12px;}
.exif-row dt{color:var(--muted);letter-spacing:.08em;flex:0 0 auto;}
.exif-row dd{margin:0;text-align:right;color:var(--cream);font-family:var(--mono);font-size:11px;letter-spacing:.04em;}

.lb-bottom{position:relative;z-index:5;margin:0 16px 16px;padding:12px 18px;border-radius:16px;
  background: linear-gradient(135deg, rgba(22,22,24,.62) 0%, rgba(22,22,24,.42) 100%);
  border: 1px solid var(--glass-border);
  box-shadow: 0 8px 30px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.12);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  display:flex;align-items:center;gap:18px;transform:translateY(12px);opacity:0;transition:all .4s var(--fluid-spring) .05s;}
.lightbox.open .lb-bottom{transform:none;opacity:1;}
.lb-info{display:flex;align-items:center;gap:14px;flex-wrap:wrap;flex:1;min-width:0;}
.lb-info .li-title{font-family:var(--serif);font-size:15px;letter-spacing:.05em;}
.lb-info .li-dot{color:rgba(255,255,255,.2);}
.lb-info .li-meta{font-size:11.5px;color:var(--muted);letter-spacing:.08em;}
.tag-pill{font-size:10.5px;letter-spacing:.1em;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:var(--muted);}
.lb-progress{position:absolute;left:18px;right:18px;bottom:6px;height:2px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;}
.lb-progress i{display:block;height:100%;width:0;background:var(--orange);}
.lb-mobile-tools{display:none;}
.ui-hidden .lb-top,.ui-hidden .lb-bottom{opacity:0;pointer-events:none;transform:translateY(0);}

.lb-motion-btns{position:absolute;top:75px;right:20px;z-index:50;display:flex;gap:8px;
  opacity:0;pointer-events:none;transform:translateY(-8px);
  transition:opacity 0.35s var(--fluid-damp), transform 0.5s var(--fluid-spring);}
.lb-motion-btns.show{opacity:1;pointer-events:auto;transform:translateY(0);}
.lb-motion-btns.shift-for-exif{transform:translateY(0) translateX(-280px);}
.lb-motion-btns > .glass-btn{height:30px;padding:0 14px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,0.4);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);}
@media (max-width:860px){
  .lb-motion-btns{position:relative;top:auto;right:auto;margin:0 10px 8px auto;justify-content:flex-end;transform:none;}
  .lb-motion-btns.show{opacity:1;pointer-events:auto;transform:none;}
  .lb-motion-btns.shift-for-exif{transform:none;}
  .lb-motion-btns.hide-for-exif{opacity:0;pointer-events:none;}
}

.floating-backdrop{position:fixed;inset:0;background:transparent;pointer-events:auto;touch-action:none;}
.ctx-menu{position:fixed;min-width:180px;max-height:min(70vh, 520px);overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none;
  padding:8px;border-radius:14px;
  background: linear-gradient(135deg, rgba(22,22,24,.88) 0%, rgba(22,22,24,.72) 100%);
  border: 1px solid var(--glass-border);
  backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);
  box-shadow: 0 10px 40px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.12);
  -webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;
  animation:popIn .22s var(--fluid-spring);}
.ctx-menu::-webkit-scrollbar{display:none;}
.ctx-menu::after{content:"";position:absolute;bottom:0;left:0;right:0;height:24px;pointer-events:none;
  background:linear-gradient(to top, rgba(22,22,24,.6), transparent);border-radius:0 0 14px 14px;
  opacity:0;transition:opacity .2s;}
.ctx-menu.scrollable::after{opacity:1;}
@keyframes popIn{from{opacity:0;transform:scale(.95) translateY(-4px);}to{opacity:1;transform:none;}}
.ctx-menu button{display:block;width:100%;text-align:left;padding:9px 13px;border-radius:9px;font-size:13px;color:var(--cream);letter-spacing:.05em;transition:background .2s;}
.ctx-menu button:hover{background:rgba(255,255,255,.1);}
.ctx-menu button.danger{color:#D9705E;}
.ctx-menu .sep{height:1px;background:rgba(255,255,255,.1);margin:6px 4px;}

.modal-mask{position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:20px;background:rgba(6,6,7,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .3s var(--ease);}
.modal-mask.open{opacity:1;pointer-events:auto;}
.modal{width:min(520px,100%);max-height:86vh;overflow-y:auto;border-radius:20px;padding:26px;
  background: linear-gradient(135deg, rgba(28,28,30,.92) 0%, rgba(28,28,30,.78) 100%);
  border: 1px solid rgba(255,255,255,.16);
  backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);
  box-shadow:0 30px 80px rgba(0,0,0,.7);transform:scale(.96);transition:transform .35s var(--fluid-spring);}
.modal-mask.open .modal{transform:none;}
.modal h3{font-family:var(--serif);font-weight:300;font-size:22px;letter-spacing:.06em;margin:0 0 20px;}

.btn-primary{padding:10px 22px;border-radius:999px;background:var(--cream);color:#151515;font-size:13px;letter-spacing:.08em;transition:all .3s var(--fluid-spring);}

.btn-ghost{padding:10px 22px;border-radius:999px;border:1px solid rgba(255,255,255,.2);font-size:13px;color:var(--muted);transition:all .3s var(--ease);}

.btn-danger{background:rgba(217,112,94,.9);color:#fff;}

  opacity:0;pointer-events:none;transition:all .35s var(--fluid-spring);white-space:nowrap;

.year-nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:34px;}

.ta-btn:active{transform:scale(0.95);}

.editor{position:fixed;inset:0;z-index:250;display:flex;flex-direction:column;background:rgba(8,8,9,.94);backdrop-filter:blur(30px);opacity:0;pointer-events:none;transition:opacity .35s var(--ease);}

.editor-btn{padding:7px 14px;border-radius:9px;font-size:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:var(--cream);transition:all .25s;}
.editor-btn:hover{background:rgba(255,255,255,.15);}
.editor-btn:active{transform:scale(0.95);}
.editor-btn.active{background:var(--orange);border-color:var(--orange);color:#fff;}

.quick-nav{position:fixed;right:20px;top:50%;transform:translateY(-50%);z-index:50;display:flex;flex-direction:column;gap:12px;align-items:center;opacity:0;pointer-events:none;transition:opacity .3s;}

.qn-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);cursor:pointer;position:relative;transition:all .3s var(--fluid-spring);}

.qn-dot.active{background:var(--orange);border-color:var(--orange);transform:scale(1.4);box-shadow:0 0 10px rgba(196,106,59,.5);}
.qn-tooltip{position:absolute;right:24px;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.8);color:#fff;padding:4px 8px;border-radius:4px;font-size:11px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s;border:1px solid rgba(255,255,255,.2);}
.qn-dot:hover .qn-tooltip{opacity:1;}

.long-press-halo{position:fixed;pointer-events:none;z-index:9999;border-radius:50%;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.35);box-shadow:0 8px 32px rgba(0,0,0,0.4),inset 0 1px 2px rgba(255,255,255,0.5);backdrop-filter:blur(12px) saturate(180%);-webkit-backdrop-filter:blur(12px) saturate(180%);opacity:0;transform:translate(-50%,-50%) scale(0.5);transition:all 0.4s var(--fluid-spring);}

.glass-btn:focus-visible,.lb-btn:focus-visible,.lb-nav:focus-visible,.lb-mobile-tools button:focus-visible,.chip:focus-visible,.ct-btn:focus-visible,.text-btn:focus-visible,.menu-toggle:focus-visible,.scroll-fabs button:focus-visible,.select-bar button:focus-visible,.back-btn:focus-visible,.editor-btn:focus-visible,.btn-primary:focus-visible,.btn-ghost:focus-visible,.album-more:focus-visible,.film-arrow:focus-visible,.year-more:focus-visible,.year-select:focus-visible,.album-select-bar button:focus-visible,.trash-select-bar button:focus-visible,.lb-motion-btns button:focus-visible{outline:2px solid var(--orange);outline-offset:2px;}

/* 1. IndexedDB */
const DB_NAME = 'darkroom-gallery'; const DB_VER = 2;
let dbPromise = null;
function openDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('photos'))   db.createObjectStore('photos',   { keyPath: 'id' });
      if (!db.objectStoreNames.contains('albums'))   db.createObjectStore('albums',   { keyPath: 'id' });
      if (!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', { keyPath: 'key' });
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror   = e => reject(e.target.error);
  });
  return dbPromise;
}
async function idbAll(store) { const db = await openDB(); return new Promise((res, rej) => { const r = db.transaction(store).objectStore(store).getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error); }); }
async function idbGet(store, key) { const db = await openDB(); return new Promise((res, rej) => { const r = db.transaction(store).objectStore(store).get(key); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbPut(store, val) { const db = await openDB(); return new Promise((res, rej) => { const r = db.transaction(store, 'readwrite').objectStore(store).put(val); r.onsuccess = () => res(val); r.onerror = () => rej(r.error); }); }
async function idbDel(store, key) { const db = await openDB(); return new Promise((res, rej) => { const r = db.transaction(store, 'readwrite').objectStore(store).delete(key); r.onsuccess = () => res(); r.onerror = () => rej(r.error); }); }
async function idbClear(store) { const db = await openDB(); return new Promise((res, rej) => { const r = db.transaction(store, 'readwrite').objectStore(store).clear(); r.onsuccess = () => res(); r.onerror = () => rej(r.error); }); }

const urlCache = new Map();
function photoSrc(p) { if (p.blob) { if (!urlCache.has(p.id)) urlCache.set(p.id, URL.createObjectURL(p.blob)); return urlCache.get(p.id); } return p.src || ''; }
function videoSrc(p) { if (p.videoBlob) { const k = 'v_' + p.id; if (!urlCache.has(k)) urlCache.set(k, URL.createObjectURL(p.videoBlob)); return urlCache.get(k); } return p.videoSrc || ''; }
function coverSrc(p) { if (p.kind === 'live') { if (p.coverBlob) { const k = 'c_' + p.id; if (!urlCache.has(k)) urlCache.set(k, URL.createObjectURL(p.coverBlob)); return urlCache.get(k); } return 'data:,'; } return photoSrc(p); }
function revokePhotoURL(id) { ['', 'v_', 'c_'].forEach(pre => { const k = pre + id; const u = urlCache.get(k); if (u) { URL.revokeObjectURL(u); urlCache.delete(k); } }); }

let unlockedAlbums;
try { const raw = sessionStorage.getItem('dr-unlocked'); const parsed = raw ? JSON.parse(raw) : []; unlockedAlbums = new Set(Array.isArray(parsed) ? parsed.filter(x => typeof x === 'string') : []); }
catch (e) { unlockedAlbums = new Set(); try { sessionStorage.removeItem('dr-unlocked'); } catch (e2) {} }

function albumOf(p) { return state.albums.find(a => a.id === p.albumId) || null; }
function albumsOf(p) { const ids = [p.albumId, ...(p.extraAlbumIds || [])].filter(Boolean); const uniq = [...new Set(ids)]; return uniq.map(id => state.albums.find(a => a.id === id)).filter(Boolean); }
function isAlbumLocked(a) { return !!(a && a.password && !unlockedAlbums.has(a.id)); }
function sceneName(id) { if (!id) return ''; const s = state.sceneTypes.find(x => x.id === id); return s ? s.name : ''; }
function isSceneName(name) { return state.sceneTypes.some(s => s.name === name); }
function visiblePhotos() { return state.photos.filter(p => !p.deletedAt && !isAlbumLocked(albumOf(p))); }
function getPhoto(id) { return state.photos.find(p => p.id === id) || null; }

function albumHasPhotos(albumId) {
  return state.photos.some(p => !p.deletedAt && albumsOf(p).some(a => a.id === albumId));
}
function nonEmptyAlbums(extraId) {
  return state.albums.filter(a => albumHasPhotos(a.id) || (extraId && a.id === extraId));
}
function formatAlbumDeletionMsg(baseMsg, albumNames) {
  if (!albumNames || !albumNames.length) return baseMsg;
  if (albumNames.length <= 3) return `${baseMsg}，「${albumNames.join('」「')}」相册已彻底删除`;
  return `${baseMsg}，${albumNames.length} 个相册已彻底删除`;
}
function formatAlbumHiddenMsg(baseMsg, albumNames) {
  if (!albumNames || !albumNames.length) return baseMsg;
  if (albumNames.length <= 3) return `${baseMsg}，「${albumNames.join('」「')}」相册已自动隐藏`;
  return `${baseMsg}，${albumNames.length} 个相册已自动隐藏`;
}

function sortPhotos(list, mode = 'newest') {
  const arr = [...list];
  const restoreCmp = (a, b) => (b.restoredAt || 0) - (a.restoredAt || 0);
  if (mode === 'newest') arr.sort((a, b) => { const r = restoreCmp(a, b); if (r) return r; return String(b.date || '').localeCompare(String(a.date || '')); });
  else if (mode === 'oldest') arr.sort((a, b) => String(a.date || '').localeCompare(String(b.date || '')));
  else if (mode === 'recent') arr.sort((a, b) => { const r = restoreCmp(a, b); if (r) return r; return (b.createdAt || 0) - (a.createdAt || 0); });
  else if (mode === 'fav') arr.sort((a, b) => { if (a.favorite !== b.favorite) return a.favorite ? -1 : 1; const r = restoreCmp(a, b); if (r) return r; return String(b.date || '').localeCompare(String(a.date || '')); });
  else if (mode === 'random') {
    const seed = window.__homeRandomSeed || (window.__homeRandomSeed = Math.random());
    const hash = s => { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; };
    arr.sort((a, b) => (hash(a.id + seed) % 1000) - (hash(b.id + seed) % 1000));
  }
  return arr;
}

function applyStoryFlag(p, on) { applyFeatureFlag(p, 'story', on); }
function applyFeatureFlag(p, flag, on) {
  p.featuredIn = p.featuredIn || [];
  const has = p.featuredIn.includes(flag);
  if (on && !has) p.featuredIn = [...p.featuredIn, flag];
  else if (!on && has) p.featuredIn = p.featuredIn.filter(x => x !== flag);
  p.updatedAt = Date.now();
}

/* 4. 路由 */
const routes = { home: renderHome, gallery: renderGallery, album: renderAlbum, story: renderStory, search: renderSearch, timeline: renderTimeline, favorites: renderFavorites, about: renderAbout, upload: renderUpload, trash: renderTrash };
let currentRoute = 'home';
const scrollKey = 'dr-scroll-map';
let scrollMap = {};
try { scrollMap = JSON.parse(sessionStorage.getItem(scrollKey) || '{}'); } catch(e){}

function saveScrollPosition() {
  scrollMap[location.hash || '#/home'] = window.scrollY;
  try { sessionStorage.setItem(scrollKey, JSON.stringify(scrollMap)); } catch(e){}
}
function restoreScrollPosition() {
  const y = scrollMap[location.hash || '#/home'];
  if (typeof y === 'number' && y > 0) {
    requestAnimationFrame(() => requestAnimationFrame(() => { window.scrollTo({ top: y, behavior: 'auto' }); updateFabBackState(); }));
  } else { window.scrollTo({ top: 0, behavior: 'auto' }); updateFabBackState(); }
}
function parseHash() {
  const raw = location.hash.replace(/^#\/?/, '') || 'home';
  const [name, qs] = raw.split('?');
  return { name: name || 'home', params: new URLSearchParams(qs || '') };
}
function route() {
  cancelLongPress();
  saveScrollPosition();
  const { name, params } = parseHash();
  const fromName = lastRouteName;
  lastRouteName = routes[name] ? name : 'home';
  currentRoute = lastRouteName;
  exitSelectMode(); exitTrashSelect(); exitAlbumSelect();
  closeLightbox(true); closeMenus(); closeAllModals();
  masonryRegistry.length = 0;
  const fn = routes[currentRoute];
  try { fn(params); }
  catch (err) { console.error(err); appRoot.innerHTML = `<div class="page"><div class="empty"><strong>出错了</strong>${esc(err.message)}</div></div>`; }
  $$('#navLinks a').forEach(a => {
    const isActive = a.dataset.nav === currentRoute;
    a.classList.toggle('active', isActive);
    if (isActive) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  if (currentRoute === 'home' && fromName === 'home') restoreScrollPosition();
  else { window.scrollTo(0, 0); updateFabBackState(); }
}
window.addEventListener('hashchange', route);

/* 5. 滚动回退栈 */
const scrollStackByRoute = {};
let isProgrammaticScroll = false;
let scrollRecordTimer = null;
let programmaticTimer = null;
let smoothScrollRaf = null;
function currentHashKey() { return location.hash || '#/home'; }
function getScrollStack() { const k = currentHashKey(); if (!scrollStackByRoute[k]) scrollStackByRoute[k] = [0]; return scrollStackByRoute[k]; }
function updateFabBackState() {
  const stack = getScrollStack(); const btn = $('#fabBack'); if (!btn) return;
  const usable = stack.length > 1 || (stack.length === 1 && Math.abs(window.scrollY - stack[0]) > 80);
  btn.disabled = !usable;
}
function recordScroll() {
  if (isProgrammaticScroll) return;
  const stack = getScrollStack(); const y = window.scrollY; const last = stack[stack.length - 1];
  if (Math.abs(y - last) < 80) return;
  stack.push(y); if (stack.length > 30) stack.shift();
  updateFabBackState();

function smoothScrollTo(targetY, duration = 800) {
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { window.scrollTo(0, targetY); return; }
  if (smoothScrollRaf) cancelAnimationFrame(smoothScrollRaf);
  const startY = window.scrollY; const distance = targetY - startY;
  if (Math.abs(distance) < 1) return;
  let startTime = null; const ease = t => 1 - Math.pow(1 - t, 3);
  const step = ts => {
    if (!startTime) startTime = ts;
    const elapsed = ts - startTime; const p = Math.min(elapsed / duration, 1);
    window.scrollTo(0, startY + distance * ease(p));
    if (p < 1) smoothScrollRaf = requestAnimationFrame(step); else smoothScrollRaf = null;
  };
  smoothScrollRaf = requestAnimationFrame(step);
}
function doScrollBack() {

function positionMenu(menu, x, y, opts = {}) {
  const mw = menu.offsetWidth || 190;
  const mh = menu.offsetHeight || 200;
  let px = opts.align === 'right' ? x - mw : x;
  px = Math.min(Math.max(8, px), window.innerWidth - mw - 8);
  let py;
  if (opts.anchor === 'above') py = y - mh - 8;
  else if (opts.anchor === 'below') py = y + 8;
  else py = y;
  py = Math.min(Math.max(8, py), window.innerHeight - mh - 8);
  menu.style.left = px + 'px'; menu.style.top = py + 'px';
}

function makePenetrationHandler(backdrop) {
  return e => {
    const x = e.clientX, y = e.clientY;
    e.preventDefault(); e.stopPropagation();
    backdrop.style.pointerEvents = 'none';
    const target = document.elementFromPoint(x, y);

    if (!target) return;
    const isNav = target.closest('.nav');
    const isLbTop = target.closest('.lb-top');
    const isLbTools = target.closest('.lb-mobile-tools');
    const isCard = target.closest('.photo-card, .polaroid-card, .frame, .today-film');

    if (isNav || isLbTop || isLbTools || isCard || isCardBtn) {
      const clickable = target.closest('button,a') || (isCard ? target.closest('.photo-card, .polaroid-card, .frame, .today-film') : null);
      if (clickable) clickable.click();
    }
  };
}

function openFloatingLayer(menuEl, zIndex, x, y, opts = {}) {
  closeMenus();

  backdrop.className = 'floating-backdrop';

  backdrop.addEventListener('wheel', e => { e.preventDefault(); e.stopPropagation(); closeMenus(); }, { passive: false });
  menuEl.style.zIndex = String(zIndex);
  document.body.appendChild(backdrop);
  document.body.appendChild(menuEl);
  if (typeof x === 'number' && typeof y === 'number') positionMenu(menuEl, x, y, opts);
  activeMenus.push({ menu: menuEl, backdrop });

const masonryRegistry = [];
function layoutMasonry(container, cards) {
  const w = container.clientWidth; if (!w) return;
  const gap = 18; let cols = 4;
  if (w < 1180) cols = 3;
  if (w < 820)  cols = 2;
  if (w < 430)  cols = 1;
  const colW = (w - gap * (cols - 1)) / cols;
  const heights = new Array(cols).fill(0);
  cards.forEach(card => {
    const ratio = parseFloat(card.dataset.ratio) || 1.3;
    let h = colW * ratio;
    if (card.dataset.kind === 'polaroid') h = colW * ratio + 36;
    if (card.dataset.kind === 'film') h = colW * ratio + 48;
    let col = 0;
    for (let i = 1; i < cols; i++) if (heights[i] < heights[col]) col = i;
    const x = col * (colW + gap), y = heights[col];
    card.style.width = colW + 'px'; card.style.height = h + 'px';
    card.style.left = x + 'px'; card.style.top = y + 'px';
    heights[col] = y + h + gap;
  });
  container.style.height = (Math.max(...heights) - gap) + 'px';
}
function renderMasonry(container, photos, opts = {}) {
  container.innerHTML = '';
  container.classList.add('masonry');
  if (!photos.length) { container.style.height = '0px'; return; }
  const cards = photos.map((p, i) => { const c = makeCard(p, i, opts); container.appendChild(c); return c; });
  const layout = () => layoutMasonry(container, cards);
  masonryRegistry.push(layout);
  requestAnimationFrame(layout);
}
let resizeTimer = null;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => masonryRegistry.forEach(fn => fn()), 120); });

function makeCard(p, i, opts = {}) {
  const card = document.createElement('article');
  const isFilm = p.kind === 'film';
  const isVideo = p.kind === 'live';
  card.className = 'photo-card' + (p.kind === 'polaroid' ? ' is-polaroid' : '') + (isFilm ? ' is-film' : '');
  card.dataset.id = p.id; card.dataset.kind = p.kind || 'photo'; card.dataset.ratio = p.ratio || 1.3;
  card.style.setProperty('--i', i);
  const src = isVideo ? coverSrc(p) : photoSrc(p);
  const filmHoles = isFilm ? `<div class="film-holes-top"></div><div class="film-holes-bottom"></div><span class="film-number">${pad2(i+1)}</span>` : '';
  card.innerHTML = `
    <div class="card-media"><img src="${esc(src)}" alt="${esc(p.title)}" loading="lazy" draggable="false"></div>
    ${p.kind === 'polaroid' ? `<div class="polaroid-caption">${esc(p.title)}</div>` : ''}
    ${filmHoles}

}

async function toggleFavorite(id) {

async function toggleStoryFeature(p) {
  const snapshot = { featuredIn: (p.featuredIn || []).slice(), updatedAt: p.updatedAt };
  p.featuredIn = p.featuredIn || [];
  const wasOn = p.featuredIn.includes('story');
  applyStoryFlag(p, !wasOn);
  try { await idbPut('photos', p); }
  catch (err) { p.featuredIn = snapshot.featuredIn; p.updatedAt = snapshot.updatedAt; toast('保存失败：可能存储已满'); return wasOn; }
  if (p.kind === 'polaroid') toast(wasOn ? '已取消优先展示（仍会自动显示）' : '已加入故事墙优先展示');
  else toast(wasOn ? '已移出故事墙' : '已加入故事墙');
  return !wasOn;
}

async function resolveAutoAlbumConflict(type) {
  const autoId = 'auto-' + type;
  const autoName = type === 'polaroid' ? '拍立得' : '胶卷';
  const manualSame = state.albums.filter(a => a.id !== autoId && a.name === autoName);
  let result;
  if (!manualSame.length) result = { merge: false, targetId: autoId };
  else {
    const mergedId = manualSame[0].id;
    result = await new Promise(resolve => {
      let resolved = false;
      const finalResolve = v => { if (!resolved) { resolved = true; resolve(v); } };
      const { close, root } = makeModal(`
        <h3>相册「${esc(autoName)}」已存在</h3>
        <p style="color:var(--muted);font-size:13.5px;line-height:1.9;margin:0 0 6px">你已手动创建了名为「${esc(autoName)}」的相册。</p>
        <p style="color:var(--muted);font-size:12px;line-height:1.7;margin:0 0 6px">本次上传的「${esc(autoName)}」类型照片要归到哪里？</p>
        <div class="modal-actions" style="flex-direction:column;align-items:stretch">
          <button class="btn-primary" data-act="merge">合并到现有「${esc(autoName)}」</button>
          <button class="btn-ghost" data-act="separate">新建独立的「${esc(autoName)}」</button>
        </div>`, { onClose: () => finalResolve({ merge: false, targetId: autoId }) });
      if (!root) { finalResolve({ merge: false, targetId: autoId }); return; }
      root.addEventListener('click', e => {
        const act = e.target.closest('[data-act]')?.dataset.act;
        if (act === 'merge') { finalResolve({ merge: true, targetId: mergedId }); close(); }
        else if (act === 'separate') { finalResolve({ merge: false, targetId: autoId }); close(); }
      });
    });
  }
  if (!result.merge && !state.albums.some(a => a.id === autoId)) {
    try {
      const album = { id: autoId, name: autoName, desc: '按类型自动归档', builtin: true, showOnFilmstrip: false };
      await idbPut('albums', album); state.albums.push(album);
    } catch (err) { console.warn('创建自动相册失败', err); }
  }
  return result;
}

async function permanentDelete(id, skipRefresh) {
  const p = getPhoto(id);
  if (!p) return [];
  const affectedAlbumIds = new Set();
  if (p.albumId) affectedAlbumIds.add(p.albumId);
  if (Array.isArray(p.extraAlbumIds)) p.extraAlbumIds.forEach(aid => { if (aid) affectedAlbumIds.add(aid); });
  try { await idbDel('photos', id); }
  catch (err) { toast('永久删除失败：可能存储异常'); console.warn('permanentDelete failed', id, err); return []; }
  state.photos = state.photos.filter(x => x.id !== id);
  if (lbEl.classList.contains('open') && LB.ids.includes(id)) {
    const idx = LB.ids.indexOf(id);
    LB.ids = LB.ids.filter(x => x !== id);
    if (!LB.ids.length) { closeLightbox(); }
    else { LB.index = Math.min(idx, LB.ids.length - 1); renderLightbox(true); }
  }
  revokePhotoURL(id);
  for (const a of state.albums) {
    if (a.coverId === id) { a.coverId = undefined; try { await idbPut('albums', a); } catch (e) {} }
  }
  const fullyDeletedAlbums = [];
  for (const aid of affectedAlbumIds) {
    const stillReferenced = state.photos.some(x => x.albumId === aid || (Array.isArray(x.extraAlbumIds) && x.extraAlbumIds.includes(aid)));
    if (!stillReferenced) {
      const album = state.albums.find(a => a.id === aid);
      if (album) {
        try { await idbDel('albums', aid); } catch (e) {}
        state.albums = state.albums.filter(a => a.id !== aid);
        fullyDeletedAlbums.push(album.name);
      }
    }
  }
  if (!skipRefresh) {
    let msg = '已永久删除';
    if (fullyDeletedAlbums.length) msg = formatAlbumDeletionMsg(msg, fullyDeletedAlbums);
    toast(msg);
    refreshCurrentView();
  }
  return fullyDeletedAlbums;
}
async function permanentDeleteSilent(id) {
  const p = getPhoto(id);
  if (!p) return;
  const affectedAlbumIds = new Set();
  if (p.albumId) affectedAlbumIds.add(p.albumId);
  if (Array.isArray(p.extraAlbumIds)) p.extraAlbumIds.forEach(aid => { if (aid) affectedAlbumIds.add(aid); });
  try { await idbDel('photos', id); } catch (e) {}
  state.photos = state.photos.filter(x => x.id !== id);
  revokePhotoURL(id);
  for (const a of state.albums) { if (a.coverId === id) { a.coverId = undefined; try { await idbPut('albums', a); } catch (e) {} } }
  for (const aid of affectedAlbumIds) {
    const stillReferenced = state.photos.some(x => x.albumId === aid || (Array.isArray(x.extraAlbumIds) && x.extraAlbumIds.includes(aid)));
    if (!stillReferenced) {
      const album = state.albums.find(a => a.id === aid);
      if (album) { try { await idbDel('albums', aid); } catch (e) {} state.albums = state.albums.filter(a => a.id !== aid); }
    }
  }
}
